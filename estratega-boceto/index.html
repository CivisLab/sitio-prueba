<!doctype html><html lang="es"><head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estratega, boceto</title>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a software shell — tool bar on top, controls of the active tool on the left, the real map of Medellín in the middle, the comuna's combined card on the right. */
:root{
  --bg:#eef0ec; --panel:#ffffff; --ink:#17241f; --muted:#5d6b64; --line:#d6ddd8;
  --brand:#24443c; --brand-ink:#ffffff; --sage:#9fbf94; --gold:#b08a2e; --soft:#e4eae5;
  --ok:#2e8b57; --mid:#e08a1e; --bad:#c8402f; --none:#d3d9d5; --edge:#ffffff;
  --vote-a:#3a6ea5; --vote-b:#8a5aa8; --lock:#8a948f;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --panel:#17221e; --ink:#e6ece8; --muted:#9aa9a1; --line:#2a3832;
  --brand:#9fbf94; --brand-ink:#0f1714; --sage:#5f8257; --gold:#d3ad55; --soft:#1f2c27;
  --ok:#3fae6e; --mid:#eb9a35; --bad:#e2604d; --none:#33413b; --edge:#0f1714; --vote-a:#5b93cf; --vote-b:#aa7fc8; --lock:#6f7b75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --panel:#17221e; --ink:#e6ece8; --muted:#9aa9a1; --line:#2a3832;
  --brand:#9fbf94; --brand-ink:#0f1714; --sage:#5f8257; --gold:#d3ad55; --soft:#1f2c27;
  --ok:#3fae6e; --mid:#eb9a35; --bad:#e2604d; --none:#33413b; --edge:#0f1714; --vote-a:#5b93cf; --vote-b:#aa7fc8; --lock:#6f7b75; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;max-width:1520px;margin:0 auto}
.aviso{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border:1px dashed var(--gold);border-radius:10px;padding:7px 12px;font-size:12.5px}
.aviso b{color:var(--gold)}
/* top bar */
.barra{display:flex;align-items:stretch;gap:8px;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:6px;flex-wrap:wrap;position:relative}
.marca{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.marca small{font-weight:500;font-size:10.5px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.herr{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.herr button{border:0;background:transparent;color:inherit;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:150px;text-align:left;opacity:.82}
.herr button b{font-size:12.5px;font-weight:700;line-height:1.2}
.herr button span{font-size:10.5px;opacity:.85}
.herr button[aria-pressed="true"]{background:var(--panel);color:var(--ink);opacity:1}
.herr button .cand{display:inline-block;font-size:9.5px;border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:4px;opacity:.9}
.lado{display:flex;align-items:center;gap:6px;padding-right:4px}
.lado select{font:600 12.5px var(--display);background:color-mix(in srgb,var(--brand-ink) 12%,transparent);color:inherit;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);border-radius:9px;padding:7px 8px;max-width:220px}
.lado select option{color:#17241f}
.ico{width:38px;height:38px;border-radius:10px;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);background:transparent;color:inherit;display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.usr{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);background:transparent;color:inherit;border-radius:10px;padding:4px 10px 4px 4px}
.usr .av{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:800}
.usr span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.usr small{font-size:10.5px;opacity:.8}
.menu{position:absolute;right:6px;top:calc(100% + 6px);width:340px;max-width:calc(100vw - 32px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:16px;z-index:20;display:flex;flex-direction:column;gap:12px}
.menu h3{margin:0;font-size:16px}
.menu .dato{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid var(--line);padding:5px 0}
.menu .dato span:first-child{color:var(--muted)}
.planes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.planes button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 4px;font-weight:700;font-size:12px}
.planes button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.incluye{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.incluye li.no{color:var(--muted);text-decoration:line-through}
.menu .nota{font-size:11.5px;color:var(--muted);margin:0}
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:4px 0}
/* body */
main{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;gap:10px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
h2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.ctrl{display:flex;flex-direction:column;gap:12px}
.opc{display:flex;flex-direction:column;gap:6px}
.opc button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;text-align:left;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.opc button[aria-pressed="true"]{background:var(--soft);border-color:var(--brand)}
.opc button.bloq{color:var(--lock)}
.candado{font-size:10px;font-weight:700;border:1px solid var(--lock);color:var(--lock);border-radius:999px;padding:0 6px;white-space:nowrap}
.cruce label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.cruce select{margin-top:6px;width:100%;font:12.5px var(--display);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.centro{display:flex;flex-direction:column;gap:8px;position:relative}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cab h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.cab p{margin:2px 0 0;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;font-weight:600;font-size:12.5px}
.btn.prim{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.lectura{font-size:16.5px;font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.mapa{position:relative;flex:1;min-height:380px;background:var(--soft);border-radius:12px;overflow:hidden}
.mapa svg{width:100%;height:100%;display:block}
.mapa path{stroke:var(--edge);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .5s ease,opacity .3s}
.mapa path:hover{opacity:.85}
.mapa path.sel{stroke:var(--ink);stroke-width:3}
.mapa path.sel2{stroke:var(--gold);stroke-width:3}
.mapa path.bloq{fill:var(--none)!important;cursor:not-allowed}
.mapa text{font-size:11px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.5px;pointer-events:none;text-anchor:middle}
.mapa .punto{stroke:#fff;stroke-width:2;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:800}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.15);white-space:nowrap}
.fuente{position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--muted)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block}
.tiempo{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:7px 12px}
.tiempo button{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);flex:none}
.tiempo input{flex:1;accent-color:var(--brand);min-width:0}
.tiempo b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.derecha{display:flex;flex-direction:column;gap:10px;overflow:auto}
.ficha-cab h3{font-size:19px;margin:0;font-weight:800}
.ficha-cab p{margin:2px 0 0;color:var(--muted);font-size:12px}
.cruza{background:color-mix(in srgb,var(--gold) 13%,var(--panel));border-radius:10px;padding:10px 12px;font-size:13px}
.cruza b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.bloque{border-top:1px solid var(--line);padding-top:9px}
.bloque h4{margin:0 0 5px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.fila{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0}
.fila span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff}
.velo{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);border:1px dashed var(--lock);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mini{width:100%;height:44px;display:block}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.vacio{color:var(--muted);font-size:12.5px}
.capa{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 93%,transparent);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}
.capa div{max-width:440px}
.capa h3{margin:0 0 8px;font-size:18px}
.capa p{margin:0 0 10px;color:var(--muted)}
@media (max-width:1150px){main{grid-template-columns:210px minmax(0,1fr)}.derecha{grid-column:1/-1}}
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr)}
  .ctrl .opc{flex-direction:row;overflow-x:auto}
  .ctrl .opc button{min-width:170px}
  .cruce{display:none}
  .mapa{min-height:340px}
  .herr button{min-width:132px}
  .usr span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="aviso"><b>Boceto 2, para conversar.</b> El mapa es el real (límites del DANE). Las cifras son inventadas y los niveles de acceso son una propuesta para probar; los decides tú.</div>

  <header class="barra">
    <div class="marca">Estratega <small>CivisLab</small></div>
    <nav class="herr" aria-label="Herramientas">
      <button type="button" data-h="estudio" aria-pressed="true"><b>Estudio de Probabilidad Electoral</b><span>corre con IPET y el Cerebro</span></button>
      <button type="button" data-h="atlas" aria-pressed="false"><b>Análisis Territorial Multidimensional</b><span>corre con Atlas</span></button>
      <button type="button" data-h="escucha" aria-pressed="false"><b>Escucha Social Inteligente</b><span>corre con Pulso</span></button>
      <button type="button" data-h="plaza" aria-pressed="false"><b>Plaza<i class="cand">en preparación</i></b><span>estudios con personas</span></button>
    </nav>
    <div class="lado">
      <label for="espacio" class="sr" hidden>Espacio de trabajo</label>
      <select id="espacio" aria-label="Espacio de trabajo">
        <option>Medellín</option>
        <option>Campaña Concejo de Bello 2027</option>
        <option>Antioquia, 125 municipios</option>
      </select>
      <button type="button" class="ico" id="btnConf" aria-label="Configuración" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button type="button" class="usr" id="btnUsr" aria-expanded="false"><i class="av">C</i><span><b>Carlos</b><small id="usrPlan">Personalizado</small></span></button>
    </div>
    <div class="menu" id="menuUsr" hidden></div>
    <div class="menu" id="menuConf" hidden></div>
  </header>

  <main>
    <section class="panel ctrl" aria-label="Controles de la herramienta" id="ctrl"></section>

    <section class="panel centro" aria-label="Mapa">
      <div class="cab"><div><h1 id="titulo"></h1><p id="subt"></p></div><button type="button" class="btn" id="verCiudad" hidden>Ver toda la ciudad</button></div>
      <p class="lectura" id="lectura" aria-live="polite"></p>
      <div class="mapa" id="mapa">
        <svg id="svg" role="img" aria-label="Mapa de Medellín por comunas y corregimientos"></svg>
        <div class="zoom"><button type="button" id="zMas" aria-label="Acercar">+</button><button type="button" id="zMenos" aria-label="Alejar">−</button></div>
        <div class="tip" id="tip" hidden></div>
        <span class="fuente">Límites: DANE, Marco Geoestadístico Nacional, CC BY 4.0</span>
      </div>
      <div class="leyenda" id="leyenda"></div>
      <div class="tiempo" id="tiempo">
        <button type="button" id="play" aria-label="Reproducir los años">▶</button>
        <input type="range" id="anio" min="0" max="5" step="1" value="5" aria-label="Año">
        <b id="anioTxt">2023</b>
      </div>
    </section>

    <aside class="panel derecha" id="derecha" aria-label="Ficha de la comuna"></aside>
  </main>
</div>

    v.innerHTML='<div><h3>«'+t+'» es del plan '+NOMNIV[n]+'</h3><p>Con tu plan actual ('+NOMNIV[S.plan]+') ves la ciudad, pero no esta capa. Así se aplicarían las restricciones en Estratega.</p><button type="button" class="btn prim" id="cerrarCapa">Entendido</button></div>';
    m.appendChild(v);$("cerrarCapa").onclick=function(){v.remove()};
  }
  function escenarios(){
    var m=$("mapa"),v=document.createElement("div");v.className="capa";
    v.innerHTML='<div><h3>Escenarios 2027</h3><p>Aquí viven los escenarios privados del Estudio: quién podría ganar en cada comuna y con qué margen. Solo con el plan Personalizado, y nunca se publican (Ley 2494 de 2025).</p><button type="button" class="btn prim" id="cerrarCapa">Volver al mapa</button></div>';
    m.appendChild(v);$("cerrarCapa").onclick=function(){v.remove()};
  }
  function cabecera(){
    var o=H[S.h].ops[S.op[S.h]];
    $("titulo").textContent=S.h==="plaza"?"Plaza":o.t;
    $("subt").textContent=S.h==="estudio"?"Concejo de Medellín · "+ANIOS[S.anio]:S.h==="atlas"?"Comparado con Medellín, mismo año y misma fuente":S.h==="escucha"?"Medios y cuentas públicas · semana del 20 al 26 de octubre":"Sin estudios todavía";
    $("tiempo").hidden=S.h!=="estudio";
    var d=D[S.sel],t="";
    if(S.h==="estudio"){var k=S.op.estudio;t=k==="a"?"En "+ANIOS[S.anio]+", "+d.nombre+" le dio "+d.a[S.anio]+" % a la candidatura A.":k==="part"?"En "+ANIOS[S.anio]+" votó el "+d.part[S.anio]+" % de "+d.nombre+".":d.nombre+" se movió "+(S.anio?d.a[S.anio]-d.a[S.anio-1]:0)+" puntos frente a la elección anterior."}
    if(S.h==="atlas"){var s=sem(S.op.atlas,d);t=d.nombre+" está "+(s.e==="parecido"?"parecida a la ciudad":s.e+" que la ciudad")+" en "+H.atlas.ops[S.op.atlas].t.toLowerCase()+"."}
    if(S.h==="escucha")t=S.op.escucha==="menc"?"Esta semana, "+d.nombre+" tuvo "+d.menc+" menciones; pesa sobre todo "+d.tema+".":"El tono sobre "+d.nombre+" esta semana es "+(d.tono>10?"favorable":d.tono<-10?"crítico":"mixto")+".";
    if(S.h==="plaza")t="Cuando Plaza tenga estudios, aquí se verá dónde se hicieron y qué encontraron.";
    $("lectura").textContent=t;
  }
  function leyenda(){
    var x="",op=S.op[S.h];
    if(S.h==="atlas")x='<span><i style="background:var(--ok)"></i>✓ Mejor que Medellín</span><span><i style="background:var(--mid)"></i>≈ Parecido</span><span><i style="background:var(--bad)"></i>! Peor</span>';
    else if(S.h==="estudio"&&op==="a")x='<span><i style="background:var(--vote-b)"></i>Más B</span><span><i style="background:var(--vote-a)"></i>Más A</span>';
    else if(S.h==="estudio")x='<span><i style="background:var(--sage)"></i>Menos</span><span><i style="background:var(--brand)"></i>Más</span>';
    else if(S.h==="escucha"&&op==="tono")x='<span><i style="background:var(--ok)"></i>Favorable</span><span><i style="background:var(--mid)"></i>Mixto</span><span><i style="background:var(--bad)"></i>Crítico</span>';
    else if(S.h==="escucha")x='<span><i style="background:var(--none)"></i>Pocas menciones</span><span><i style="background:var(--gold)"></i>Muchas</span>';
    if(S.cruce&&S.h!=="plaza")x+='<span><i style="border-radius:50%;background:var(--ink)"></i>Punto: '+H[S.cruceH].titulo+'</span>';
    $("leyenda").innerHTML=x;
  }
  function mapa(){
    var bloqueada=S.h!=="plaza"&&!puede(H[S.h].ops[S.op[S.h]].nivel);
    GEO.f.forEach(function(g){
      var p=paths[g.nombre],c=color(S.h,D[g.nombre]);
      p.style.fill=bloqueada?"var(--none)":c.f;
      p.classList.toggle("sel",S.sel===g.nombre);p.classList.toggle("sel2",S.sel2===g.nombre);
      var pt=puntos[g.nombre];
      if(S.cruce&&S.h!=="plaza"&&puede("suscripcion")){pt.style.display="";pt.style.fill=color(S.cruceH,D[g.nombre],S.op[S.cruceH]).f}else pt.style.display="none";
    });
  }
  function curva(serie){
    var w=280,hh=44,mn=Math.min.apply(null,serie),mx=Math.max.apply(null,serie),rg=(mx-mn)||1;
    var pts=serie.map(function(v,i){return [8+i*(w-16)/(serie.length-1),hh-6-(v-mn)/rg*(hh-14)]});
    return '<svg class="mini" viewBox="0 0 '+w+' '+hh+'" aria-hidden="true"><path d="'+pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ")+'" fill="none" stroke="var(--vote-a)" stroke-width="2"/><circle cx="'+pts[5][0]+'" cy="'+pts[5][1]+'" r="3.5" fill="var(--vote-a)"/></svg>';
  }
  function velo(n,t){return '<div class="velo"><span>'+t+'</span><span class="candado">Plan '+NOMNIV[n]+'</span></div>'}
  function derecha(){
    var r=$("derecha"),d=D[S.sel];
    if(S.comparar&&S.sel2){
      var e=D[S.sel2];
      r.innerHTML='<div class="ficha-cab"><h3>'+d.nombre+' y '+e.nombre+'</h3><p>Las mismas cifras, lado a lado.</p></div>'+
        Object.keys(H.atlas.ops).map(function(k){var a=sem(k,d),b=sem(k,e);return '<div class="fila"><span>'+H.atlas.ops[k].t+'</span><span><span class="chip" style="background:'+a.c+'">'+fmt(d[k])+'</span> <span class="chip" style="background:'+b.c+'">'+fmt(e[k])+'</span></span></div>'}).join("")+
        '<div class="fila"><span>Candidatura A, '+ANIOS[S.anio]+'</span><span>'+d.a[S.anio]+' % · '+e.a[S.anio]+' %</span></div>'+
        '<div class="acciones"><button type="button" class="btn" id="finComp">Terminar de comparar</button></div>';
      $("finComp").onclick=function(){S.comparar=false;S.sel2=null;pintar()};return;
    }
    var x='<div class="ficha-cab"><h3>'+d.nombre+'</h3><p>'+(d.corr?"Corregimiento":"Comuna")+' de Medellín · las cuatro herramientas juntas</p></div>';
    x+=puede("suscripcion")?'<div class="cruza"><b>Lo que se cruza</b>'+d.nombre+' se movió '+(d.a[5]-d.a[4])+' puntos en la última elección, está '+sem("salud",d).e+(sem("salud",d).e==="parecido"?" a":" que")+' la ciudad en atención médica, y esta semana se habla sobre todo de '+d.tema+'.</div>':velo("suscripcion","El cruce entre voto, territorio y conversación es del plan Profesional.");
    x+='<div class="bloque"><h4>Estudio de Probabilidad Electoral</h4><div class="fila"><span>Candidatura A, '+ANIOS[S.anio]+'</span><span>'+d.a[S.anio]+' %</span></div><div class="fila"><span>Participación</span><span>'+d.part[S.anio]+' %</span></div>'+curva(d.a)+'</div>';
    x+='<div class="bloque"><h4>Análisis Territorial</h4>'+Object.keys(H.atlas.ops).map(function(k){var o=H.atlas.ops[k];if(!puede(o.nivel))return '<div class="fila"><span>'+o.t+'</span><span class="candado">'+NOMNIV[o.nivel]+'</span></div>';var s=sem(k,d);return '<div class="fila"><span>'+o.t+' <span class="chip" style="background:'+s.c+'">'+s.s+' '+s.e+'</span></span><span>'+fmt(d[k])+o.u+'</span></div>'}).join("")+'</div>';
    x+='<div class="bloque"><h4>Escucha Social Inteligente</h4>'+(puede("suscripcion")?'<div class="fila"><span>Menciones de la semana</span><span>'+d.menc+'</span></div><div class="fila"><span>Tema que más pesa</span><span>'+d.tema+'</span></div>':velo("suscripcion","La conversación de la semana es del plan Profesional."))+'</div>';
    x+='<div class="bloque"><h4>Plaza</h4><p class="vacio" style="margin:0">Sin estudios en esta comuna todavía.</p></div>';
    x+='<div class="acciones"><button type="button" class="btn prim" id="comp">Comparar con otra</button>'+(puede("suscripcion")?'<button type="button" class="btn" id="inf">Guardar en el informe</button>':'')+'</div>'+(S.comparar?'<p class="vacio">Toca otra comuna en el mapa.</p>':'');
    r.innerHTML=x;
    $("comp").onclick=function(){S.comparar=true;pintar()};
    var inf=$("inf");if(inf)inf.onclick=function(){inf.textContent="Guardada en el informe";inf.disabled=true};
  }
  /* menus */
  function menuUsr(){
    var m=$("menuUsr"),inc={libre:["Mapas de la ciudad y resultados por comuna","Indicadores abiertos del territorio","Sin cruces, sin conversación, sin escenarios"],suscripcion:["Todo lo de Libre","Todos los indicadores y la Escucha Social","Cruces entre herramientas e informes"],contrato:["Todo lo de Profesional","Escenarios 2027 privados (Ley 2494)","Datos por puesto y acompañamiento del equipo"]};
    m.innerHTML='<h3>Carlos Calle</h3><div class="dato"><span>Correo</span><span>el de tu cuenta de Google</span></div><div class="dato"><span>Organización</span><span>CivisLab</span></div><div class="dato"><span>Plan</span><span><b>'+NOMNIV[S.plan]+'</b></span></div><div class="dato"><span>Vigente hasta</span><span>31 dic. 2026</span></div>'+
      '<h2 style="margin:4px 0 0">Ver Estratega como</h2><div class="planes">'+["libre","suscripcion","contrato"].map(function(p){return '<button type="button" data-plan="'+p+'" aria-pressed="'+(S.plan===p)+'">'+NOMNIV[p]+'</button>'}).join("")+'</div>'+
      '<ul class="incluye">'+inc[S.plan].map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul><p class="nota">Esto es para probar cómo cambia la pantalla según el plan. En la versión real, el plan viene de la cuenta y lo controla Supabase.</p><div class="acciones"><button type="button" class="btn">Cerrar sesión</button></div>';
    m.querySelectorAll("[data-plan]").forEach(function(b){b.onclick=function(){S.plan=b.dataset.plan;$("usrPlan").textContent=NOMNIV[S.plan];menuUsr();pintar()}});
  }
  function menuConf(){
    var m=$("menuConf");
    m.innerHTML='<h3>Configuración</h3><div class="ajuste"><label for="cfSig">Signos además del color (✓ ≈ !)</label><input type="checkbox" id="cfSig"'+(S.signos?" checked":"")+'></div><div class="ajuste"><label for="cfTema">Tema</label><select id="cfTema"><option value="">Como el sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div><div class="ajuste"><span>Idioma</span><span class="vacio">Español</span></div><div class="ajuste"><span>Avisos por correo</span><span class="vacio">Alertas de la Escucha Social</span></div>';
    $("cfSig").onchange=function(){S.signos=this.checked;pintar()};
    var tm=$("cfTema");tm.value=document.documentElement.getAttribute("data-theme")||"";tm.onchange=function(){if(tm.value)document.documentElement.setAttribute("data-theme",tm.value);else document.documentElement.removeAttribute("data-theme")};
  }
  function abrir(btn,menu,fill,otro,otroBtn){var ab=menu.hidden;menu.hidden=!ab;btn.setAttribute("aria-expanded",ab);otro.hidden=true;otroBtn.setAttribute("aria-expanded","false");if(ab)fill()}
  $("btnUsr").onclick=function(e){e.stopPropagation();abrir(this,$("menuUsr"),menuUsr,$("menuConf"),$("btnConf"))};
  $("btnConf").onclick=function(e){e.stopPropagation();abrir(this,$("menuConf"),menuConf,$("menuUsr"),$("btnUsr"))};
  document.addEventListener("click",function(e){["menuUsr","menuConf"].forEach(function(id){var m=$(id);if(!m.hidden&&!m.contains(e.target)){m.hidden=true}})});
  /* wiring */
  function pintar(){ctrl();cabecera();leyenda();mapa();derecha();$("anio").value=S.anio;$("anioTxt").textContent=ANIOS[S.anio]}
  document.querySelectorAll(".herr button").forEach(function(b){b.onclick=function(){S.h=b.dataset.h;document.querySelectorAll(".herr button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});parar();pintar()}});
  $("anio").oninput=function(){S.anio=+this.value;pintar()};
  $("verCiudad").onclick=ciudad;$("zMas").onclick=function(){zoomF(.7)};$("zMenos").onclick=function(){zoomF(1.4)};
  $("espacio").onchange=function(){if(this.selectedIndex){$("lectura").textContent="En el boceto solo está armado Medellín. En la versión real, cada territorio o proyecto abre su propio espacio con las mismas herramientas.";this.selectedIndex=0}};
  function parar(){if(S.play){clearInterval(S.play);S.play=null;$("play").textContent="▶"}}
  $("play").onclick=function(){if(S.play){parar();return}if(S.anio>=5)S.anio=0;$("play").textContent="❚❚";pintar();S.play=setInterval(function(){if(S.anio>=5){parar();return}S.anio++;pintar()},1100)};
  escalarTexto();pintar();
})();
</script>
</body></html>
