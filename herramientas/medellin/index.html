<style>
:root{--papel:#F6F4EE;--superficie:#FFFFFF;--superficie-2:#EEF1EC;--tinta:#16211F;--tinta-2:#3E4C48;--tinta-3:#6A7773;
--linea:#DCE2DD;--acento:#2B4B48;--acento-tinta:#fff;--aviso:#8A5A00;--aviso-fondo:#FFF3D6;--priv:#9A2E22;--priv-fondo:#FBE3DF;
--c0:#2F6B5E;--c1:#C27C2C;--c2:#5872A8;--c3:#A2486B;--c4:#7A8F3A;--c5:#3E9DB0;--otros:#A9B3AF;--sin:#E3E7E4;color-scheme:light}

--linea:#2C3A38;--acento:#96B483;--acento-tinta:#10201D;--aviso:#F2C76B;--aviso-fondo:#3A2E14;--priv:#F2A497;--priv-fondo:#3E1F1B;
--c0:#6FB7A2;--c1:#E2A65C;--c2:#8FA7DA;--c3:#D98AAB;--c4:#B6C86E;--c5:#7CCAD8;--otros:#5F6B67;--sin:#25302E;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 Montserrat,system-ui,sans-serif}
.marca{background:var(--priv-fondo);color:var(--priv);text-align:center;font-weight:800;letter-spacing:.06em;font-size:12.5px;padding:7px 12px}
header{padding:20px 20px 8px;max-width:1240px;margin:0 auto}
.ante{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);margin:0}
h1{font-size:1.75rem;line-height:1.15;margin:4px 0 6px}h2{font-size:1.2rem;margin:0 0 4px}h3{font-size:.95rem;margin:18px 0 8px;color:var(--tinta-2)}
.nivel{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;box-shadow:inset 0 0 0 1.5px var(--tinta-2);color:var(--tinta)}
.controles{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:1240px;margin:0 auto;padding:6px 20px 12px}
.grupo{display:inline-flex;border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--superficie)}
.grupo button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--tinta-2);padding:8px 14px;min-height:40px;cursor:pointer}
.grupo button[aria-pressed=true]{background:var(--acento);color:var(--acento-tinta)}
.migas{font-size:16px;color:var(--tinta-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.migas button{min-height:40px;padding:6px 12px!important;border-radius:999px!important;background:var(--superficie)!important;border:1px solid var(--linea)!important;text-decoration:none!important}
.migas strong{padding:6px 4px}
.volver-mapa{position:absolute;left:14px;top:14px;z-index:2;font:inherit;font-weight:800;font-size:15px;color:var(--acento-tinta);background:var(--acento);border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mapa rect.fondo{fill:transparent;cursor:zoom-out}

.avatar{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:#2B4B48;overflow:hidden;display:grid;place-items:center;color:#E9EFEB;font-weight:800;font-size:17px;letter-spacing:.02em}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.credito{font-size:10.5px;line-height:1.3;color:var(--tinta-3);margin-top:2px}
.credito a{color:inherit}

.estado-metodo{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:var(--aviso-fondo);color:var(--aviso);box-shadow:inset 0 0 0 1.5px var(--aviso)}
.dist{display:flex;align-items:flex-end;gap:2px;height:28px;min-width:90px}
.dist b{flex:1;min-width:4px;background:var(--c0);border-radius:2px 2px 0 0}
.dist b.ref{background:var(--tinta-3)}
.criterio{font-size:13px;margin:4px 0}
.alerta-lista{display:inline-block;margin-top:4px;font-size:12px;color:var(--aviso);background:var(--aviso-fondo);border-radius:6px;padding:2px 6px}

.esc-asp{grid-template-columns:auto minmax(0,1fr) auto!important;align-items:start}
.esc-asp .ultimo{grid-column:2/-1}
.migas button,.enlace{font:inherit;font-weight:700;color:var(--acento);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;max-width:1240px;margin:0 auto;padding:0 20px 40px}
.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:16px 18px}
.tarjeta+.tarjeta{margin-top:14px}
.boton-sec{font:inherit;font-weight:800;font-size:14px;min-height:44px;padding:8px 16px;border-radius:999px;border:0;background:var(--acento);color:var(--acento-tinta);cursor:pointer}
.tarjeta li,.tarjeta p,.esc-asp span{overflow-wrap:anywhere}  /* las direcciones largas de los supuestos no desbordan */
.tarjeta ul{padding-left:18px}
#mapa{width:100%;height:auto;display:block;touch-action:manipulation}
#mapa path{stroke:var(--papel);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
#mapa path.activa{stroke:var(--tinta);stroke-width:2.2}
#mapa circle{stroke:var(--superficie);vector-effect:non-scaling-stroke;stroke-width:.8;cursor:pointer}
#mapa circle.activo{stroke:var(--tinta);stroke-width:2.4}
#mapa text{font-size:10px;font-weight:700;fill:var(--tinta);paint-order:stroke;stroke:var(--superficie);stroke-width:3px;pointer-events:none}
.mapa-caja{position:relative}.mini{position:absolute;right:6px;top:6px;width:26%;background:var(--superficie);border:1px solid var(--linea);border-radius:8px;padding:4px}
.mini path{stroke:var(--superficie);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:10px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.cifras div{background:var(--superficie-2);border-radius:10px;padding:10px 12px}.cifras strong{display:block;font-size:1.25rem}.cifras span{font-size:12.5px;color:var(--tinta-3)}
.barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px;margin:8px 0}
.barra .pista{grid-column:1/-1;height:8px;border-radius:5px;background:var(--sin);overflow:hidden}.barra .pista b{display:block;height:100%}
.barra small{grid-column:1/-1;color:var(--tinta-3);font-size:12px;margin-top:-2px}
.barra[data-foco]{cursor:pointer;border-radius:8px;padding:2px 4px;margin-left:-4px;margin-right:-4px}.barra[data-foco]:hover,.barra.foco{background:var(--superficie-2)}
.barra.foco span:first-child{font-weight:800}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.fam{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:4px;background:var(--superficie-2);color:var(--tinta-2)}
.aviso{background:var(--aviso-fondo);color:var(--aviso);border-radius:10px;padding:10px 12px;font-size:13.5px}
.nota{font-size:12.5px;color:var(--tinta-3)}
.desplaza{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:12px;color:var(--tinta-3);font-weight:700}td.n,th.n{text-align:right}
tr.fila{cursor:pointer}tr.fila:hover{background:var(--superficie-2)}
.sexo{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}.sexo b:first-child{background:var(--c3)}.sexo b:last-child{background:var(--c2)}
.edad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;height:70px;margin-top:6px}.edad b{background:var(--c0);border-radius:3px 3px 0 0;min-height:2px}
.edad-et{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--tinta-3);text-align:center}
.esc-asp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--linea)}
.cargando{padding:24px;text-align:center;color:var(--tinta-3)}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr);padding:0 12px 80px}header{padding:16px 12px 6px}.controles{padding:6px 12px 10px}
h1{font-size:1.45rem}.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}.mini{position:static;display:block;width:42%;margin:8px 0 0 auto}#mapa{max-height:58vh}}

ntos con personería vigente (corte 2026-10-07), https://www.cne.gov.co/index.php/partidos-movimientos-politicos-y-grupos-significativos/778; Consejo de Estado, comunicado 2024-04-18, https://www.consejodeestado.gov.co/news/2024/18.2-Abr-2024.php; IFM Noticias 2026-03, https://ifmnoticias.com/medellin/movimiento-creemos-no-alcanzo-el-umbral-para-el-senado-y-continuara-sin-personeria-juridica/)","Variante A (base): Villa va por firmas con el nombre «Creemos», como el movimiento fue al Congreso en 2026. (Infobae 2025-12-04, https://www.infobae.com/colombia/2025/12/04/movimiento-de-fico-gutierrez-inscribio-sus-listas-al-congreso-con-mas-de-800000-firmas-juliana-gutierrez-encabeza-la-del-senado/; 360 Radio 2026-10-21, https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/)","Variante B: Villa va con aval de Defensores de la Patria, el partido que representaría la eventual fusión con Salvación Nacional y Creemos. (El Colombiano 2026-09-28, https://www.elcolombiano.com/colombia/politica/posible-fusion-creemos-salvacion-nacional-defensores-de-la-patria-detalles-que-paso-PD41607019; Semana 2026-10-03, https://www.semana.com/confidenciales/articulo/batalla-por-la-alcaldia-de-medellin-los-candidatos-que-suenan-para-2027/202607/)","Sebastián López compite con aval del Centro Democrático, sin alianza con Creemos. (El Colombiano 2026-05-04, https://www.elcolombiano.com/inicio/concejo-de-medellin-elecciones-sebastian-lopez-GH36134376; El Colombiano 2026-08-16, https://www.elcolombiano.com/inicio/elecciones-alcaldia-medellin-candidatos-derecha-uribismo-creemos-EK39993513)","Daniel Carvalho compite por Dignidad & Compromiso. (El Colombiano 2026-04-06, https://www.elcolombiano.com/colombia/daniel-carvalho-habla-de-las-elecciones-a-presidencia-FH35236470 (aval: Pulzo 2026-10-10))","Aníbal Gaviria compite por la Alcaldía, con etiqueta desconocida. (Semana 2026-10-03, https://www.semana.com/confidenciales/articulo/batalla-por-la-alcaldia-de-medellin-los-candidatos-que-suenan-para-2027/202607/)","José Luis Marín es el candidato del Pacto Histórico y Esteban Restrepo el del bloque de Quintero. (Punto de Vista RDB 2026-10-05, https://www.puntodevistardb.com/2026/10/en-medellin-y-antioquia-dieciseis-aspirantes-para-dos-despachos/; 360 Radio 2026-10-21, https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/)"],"no_se_sabe":["Si el oficialismo va por firmas con el nombre «Creemos» (variante A) o con el aval de Defensores de la Patria o del partido que salga de la fusión (variante B). Ninguna fuente lo define y la fusión se presentaría al CNE a comienzos de 2027.","Si Tobón u otro fiquista compite por aparte, o si el Centro Democrático y Creemos repiten la alianza de 2023 (El Colombiano 2026-08-16 lo pone en duda).","Si López va con aval del CD o por firmas (360 Radio lo cree probable por firmas).","Si Gaviria va a la Alcaldía o a la Gobernación, y con qué etiqueta.","Quién es el candidato del bloque de Quintero y si hay consulta entre Pacto, Verdes y liberales.","El modelo es un logit: no ve la división del voto. Dos candidatos del mismo bloque no se quitan votos entre sí en el modelo.","El modelo solo ve la etiqueta de 2027, la historia 2023 de esa etiqueta y la del candidato. No ve encuestas, gobierno departamental, dinero, maquinaria ni la popularidad del alcalde saliente.","Las inscripciones son a mediados de 2027: cualquier aspirante puede entrar o salir y cualquier etiqueta puede cambiar."],"lectura":"La carrera visible es la sucesión de Federico Gutiérrez, que no puede reelegirse: Manuel Villa es su favorito y Andrés Tobón aspira solo si recibe el aval de Creemos. El Centro Democrático define avales antes de terminar 2026 y su nombre más fuerte es Sebastián López. Por fuera del uribismo: Daniel Carvalho (declarado), Aníbal Gaviria (duda entre Alcaldía y Gobernación) y el bloque de Quintero, sin candidato definido. Hay 19 nombres con fuente; la carrera supuesta toma los seis con evidencia más sólida po ONZALEZ":{"archivo":"susana-muhamad-gonzalez.png","autor":"MECCA Comunicaciones","licencia":"CC BY 3.0","url":"https://commons.wikimedia.org/wiki/File:Susana_Muhamad.jpg","licencia_url":"https://creativecommons.org/licenses/by/3.0"}},"fotoRaiz":"../actores/","txt":{"ciudad":"Medellín","titulo":"Medellín","alcaldia":"Alcaldía","concejo":"Concejo de Medellín","unidad":"comuna","Unidad":"Comuna o corregimiento","unidades":"comunas y corregimientos","Unidades":"Las comunas y los corregimientos","una":"una comuna o un corregimiento","rural":"Los corregimientos","mini":"Medellín completa, con sus corregimientos","fuentes":"Escrutinio oficial (MMV) en 2019 y 2023. Geometría: DANE, capa «Comuna y Localidad» 2018.","historico":"Hasta 2015, CEDAE; 2019 y 2023, escrutinio.","mapa_extra":" 15 puestos de los corregimientos caen, en el mapa del DANE, dentro de una comuna vecina: su comuna es la de la Registraduría.","sin":"Puesto censo y puestos nacionales (código de comuna 00 de la Registraduría): no pertenecen a ninguna comuna; cuentan solo en la ciudad."},"rurales":["50","60","70","80","90"]}</script>

<script>
const V=JSON.parse(document.getElementById('vista').textContent), C=window.BOGOTA, R=window.BOGOTA_RESUMEN, M=V.mapa, T=V.txt;
const rural=cod=>V.rurales.includes(cod);
window.BOGOTA_LOC=window.BOGOTA_LOC||{};

function iniciales(n){const w=String(n||'').split(/\s+/).filter(x=>x&&!/^(de|del|la|las|los|y)$/i.test(x));if(!w.length)return '';return (w[0][0]+(w.length>=4?w[2][0]:w.length>1?w[w.length-1][0]:'')).toUpperCase()}  /* nombre y primer apellido */
function avatar(nombre,foto,raiz){return `<span class="avatar" aria-hidden="true">${foto?`<img src="${raiz}${esc(foto.archivo)}" alt="" loading="lazy">`:esc(iniciales(nombre))}</span>`}
function credito(foto){return foto?`<div class="credito">Foto: <a href="${esc(foto.url)}" target="_blank" rel="noopener">${esc(foto.autor)}</a>, ${foto.licencia_url?`<a href="${esc(foto.licencia_url)}" target="_blank" rel="noopener license">${esc(foto.licencia)}</a>`:esc(foto.licencia)}, Wikimedia Commons (adaptada)</div>`:''}

const CRITERIOS={'1_rps_menor_que_persistencia':'Reparte las curules mejor que suponer que se repite 2023 (RPS)',
  '2_brier_menor_que_persistencia':'Acierta mejor qué listas sacan al menos una curul (Brier)',
  '3_cobertura_80_entre_70_y_90':'El rango del 80 % acierta entre 70 % y 90 % de las veces'};
function concejo2027(k){if(!k||!k.listas)return '';
  const f=(x,d=1)=>x==null?'—':Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
  const pc=x=>x==null?'—':f(100*x)+' %';
  const listas=k.listas.filter(l=>l.id!=='blanco'),blanco=k.listas.find(l=>l.id==='blanco');
  const filas=listas.map(l=>{const ps=Object.entries(l.p_curules||{}).map(([n,p])=>[+n,p]),max=Math.max(1,...ps.map(z=>z[0])),pm=Math.max(.0001,...ps.map(z=>z[1]));
    const barras=Array.from({length:max+1},(_,n)=>{const p=(ps.find(z=>z[0]===n)||[0,0])[1];return `<b class="${n===l.curules_2023?'ref':''}" style="height:${Math.max(2,100*p/pm)}%" title="${n} curules: ${pc(p)}"></b>`}).join('');
    return `<tr><td>${esc(l.partido_v||l.partido)}${l.alerta?`<br><span class="alerta-lista">⚠ ${esc(l.alerta)}</span>`:''}</td><td class="n">${l.curules_2023??'—'}</td><td class="n"><strong>${f(l.curules_esperadas)}</strong></td><td class="n">${l.curules_rango_80?l.curules_rango_80[0]+' a '+l.curules_rango_80[1]:'—'}</td><td class="n">${pc(l.p_pasa_umbral)}</td><td><div class="dist" aria-label="Probabilidad de cada número de curules">${barras}</div></td></tr>`}).join('');
  const v=k.validacion||{},m=(v.medidas_antioquia_125||{}).modelo||{};
  const crit=Object.entries(v.criterios||{}).map(([c,ok])=>`<p class="criterio">${ok?'✔':'✘'} ${esc(CRITERIOS[c]||c)}</p>`).join('');
  return `<section class="tarjeta"><p class="ante">Concejo 2027 · nivel: contrato · ${esc(k.marca||'')}</p>
  <h2>Concejo 2027 <span class="estado-metodo">Método ${esc(k.estado_metodo||'sin estado')}</span></h2>
  <p class="nota">Modelo ${esc(k.modelo||'')} · corrida del ${esc(k.generado||'')}${k.preregistro?.sha256?` · sello ${esc(k.preregistro.sha256.slice(0,12))}`:''}</p>
  <p class="aviso"><strong>Supuesto:</strong> ${esc((k.supuestos||[])[0]||'se repiten las listas de 2023')}</p>
  ${k.advertencia?`<p class="nota">${esc(k.advertencia)}</p>`:''}
  <p class="nota">${f(k.curules_por_repartir,0)} curules por cifra repartidora, más ${esc(k.curul_oposicion||'la de oposición')}. Umbral supuesto: ${f(k.umbral_supuesto,0)} votos, sobre ${f(k.validos_supuestos,0)} válidos de 2023.</p>
  <div class="desplaza"><table><tr><th>Lista</th><th class="n">Curules 2023</th><th class="n">Esperadas</th><th class="n">Rango 80 %</th><th class="n">Pasa el umbral</th><th>Cuántas curules (gris: las de 2023)</th></tr>${filas}</table></div>
  ${blanco?`<p class="nota">Voto en blanco: ${pc(blanco.cuota_media)} de los válidos (rango ${pc(blanco.cuota_rango?.[0])} a ${pc(blanco.cuota_rango?.[1])}).</p>`:''}
  <h3>Por qué es «${esc(k.estado_metodo||'')}»</h3>${crit}<p class="nota">Medido en 2019 → 2023 en ${m.municipios??'—'} municipios de Antioquia: el rango del 80 % de las curules acertó ${pc(m.cobertura_80_curules)} de las veces. Los números no dicen quién de cada lista queda electo.</p></section>`}

const ANIOS=Object.keys(C.elecciones).sort();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('es-CO');
const p100=x=>x==null?'—':Number(x).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';  /* el contrato ya trae el porcentaje */
const p01=x=>x==null?'—':p100(100*x);   /* participación del contrato, de 0 a 1 */
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL=['--c0','--c1','--c2','--c3','--c4','--c5'].map(css);
let S={anio:ANIOS[ANIOS.length-1],corp:'A',loc:null,puesto:null,foco:null,sec:false};
const SEC=V.sector?Object.fromEntries(V.sector.partes.map(p=>[p.cod,p])):null;
const colorSec=n=>{const i=V.sector.orden.indexOf(n);return i>=0&&i<COL.length?COL[i]:css('--otros')};
const lider=cod=>{const p=SEC&&SEC[cod];if(!p)return null;return p.candidaturas.slice().sort((a,b)=>b.p_mas_votada-a.p_mas_votada||b.cuota_media-a.cuota_media)[0]};
function leerHash(){const p=location.hash.slice(1).split('/');if(ANIOS.includes(p[0]))S.anio=p[0];if(p[1]==='A'||p[1]==='C')S.corp=p[1];S.loc=p[2]||null;S.puesto=p[3]||null}
function escribirHash(){history.replaceState(null,'','#'+[S.anio,S.corp,S.loc||'',S.puesto||''].join('/').replace(/\/+$/,''))}
const bloque=e=>e?(S.corp==='A'?e.alcaldia:e.concejo):null;
const filas=b=>b?(S.corp==='A'?b.candidaturas:b.listas)||[]:[];
const nombre=x=>S.corp==='A'?x.nombre:x.partido;
const elecCiudad=()=>C.elecciones[S.anio];
const elecLoc=cod=>R[cod]?.elecciones[S.anio];
const nomLoc=cod=>R[cod]?.territorio.nombre||M.loc[cod]?.n||cod;
function colores(){const m={};filas(bloque(elecCiudad())).slice(0,6).forEach((x,i)=>m[x.id]=COL[i]);return m}
const fam=x=>(x.familias||[]).length?`<span class="fam" title="Familia de partido: capa derivada de la regla del modelo, no es un dato">${esc(x.familias.join('+'))}</span>`:'';
function nombreDe(id){const L=S.loc&&BOGOTA_LOC[S.loc];const f=(L?filas(bloque(L.elecciones[S.anio])):[]).find(x=>x.id===id)||filas(bloque(elecCiudad())).find(x=>x.id===id);return f?nombre(f):id}
function modoSec(){return S.sec&&SEC&&S.corp==='A'&&!S.loc}
function sectorTarjeta(){const x=V.sector;if(!x)return '';const v=x.validacion||{},g=v.gamma_1||v.gamma_0||{};
  const comp=Object.entries(x.componentes||{}).map(([k,e])=>`${esc(k.replace(/^[A-Z]_/,'').replace(/_/g,' '))}: ${esc(e)}`).join(' · ');
  return `<section class="tarjeta"><p class="ante">2027 por ${esc(T.unidad)} · nivel: contrato · ${esc(x.marca||V.sello)}</p><h2>Dónde sería la más votada <span class="estado-metodo">${esc(x.estado||'experimental')}</span></h2>
  <p class="aviso">${esc(x.advertencia||'')}</p><p class="nota">Componentes: ${comp}. Prueba 2019 → 2023: líder acertado en ${g.lider_acertado??'—'} de ${g.partes??'—'}, error de cuota de ${g.error_cuota_pp!=null?Number(g.error_cuota_pp).toLocaleString('es-CO'):'—'} puntos.</p>
  <p><button class="boton-sec" data-sec="${S.sec?0:1}">${S.sec?'Volver a los resultados en el mapa':'Ver en el mapa'}</button></p></section>`}
function sectorParte(cod){const p=SEC&&SEC[cod];if(!p||S.corp!=='A')return '';const max=Math.max(.01,...p.candidaturas.map(c=>c.cuota_media));
  return `<section class="tarjeta"><p class="ante">2027 en ${esc(nomLoc(cod))} · ${esc(V.sector.marca||V.sello)}</p><h2>Escenario por ${esc(T.unidad)} <span class="estado-metodo">${esc(V.sector.estado||'experimental')}</span></h2>
  ${p.candidaturas.map(c=>`<div class="barra"><span>${esc(c.nombre_v||c.nombre)}</span><span class="num"><strong>${p100(100*c.p_mas_votada)}</strong> más votada · cuota ${p100(100*c.cuota_media)}</span><div class="pista"><b style="width:${100*c.cuota_media/max}%;background:${colorSec(c.nombre)}"></b></div></div>`).join('')}
  <p class="nota">«Más votada» es la probabilidad de quedar primera en ${esc(nomLoc(cod))}, no la de ganar la alcaldía. Experimental: solo usa la geografía de 2023.</p></section>`}
function ir(o){if(('anio' in o&&o.anio!==S.anio)||('corp' in o&&o.corp!==S.corp))S.foco=null;Object.assign(S,o);escribirHash();pintar()}

function cargar(cod,listo){if(BOGOTA_LOC[cod])return listo();const s=document.createElement('script');s.src=`datos/localidades/${cod}.js`;
  s.onload=listo;s.onerror=()=>{$('#panel').innerHTML=`<p class="aviso">No se pudo cargar ${T.una}.</p>`};document.head.appendChild(s)}
function proy(lat,lon){const x=lon*Math.PI/180,y=Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));return [M.proy.dx+(x-M.proy.x0)*M.proy.k,M.proy.r+(M.proy.y1-y)*M.proy.k]}
function porcentajeLoc(cod,id){const f=filas(bloque(elecLoc(cod))).find(x=>x.id===id);return f?f.porcentaje_validos:0}

function mapa(){const c=colores(),svg=$('#mapa');let vb=M.vb;
  if(S.loc&&M.loc[S.loc]){const b=M.loc[S.loc].bb,m=Math.max(b[2],b[3])*.08;vb=[b[0]-m,b[1]-m,b[2]+2*m,b[3]+2*m]}
  svg.setAttribute('viewBox',vb.join(' '));const k=vb[2]/600;
  const max=S.foco?Math.max(.0001,...Object.keys(M.loc).filter(cod=>!rural(cod)).map(cod=>porcentajeLoc(cod,S.foco))):1;  /* lo rural, con pocos votos, no fija la escala */
  const relleno=cod=>{if(modoSec()){const l=lider(cod);return l?[colorSec(l.nombre),.25+.75*l.p_mas_votada]:[css('--sin'),1]}
    const f=filas(bloque(elecLoc(cod)));if(!f.length)return [css('--sin'),1];
    if(S.foco)return [c[S.foco]||COL[0],.08+.92*Math.min(1,porcentajeLoc(cod,S.foco)/max)];return [c[f[0].id]||css('--otros'),.9]};
  let h=S.loc?`<rect class="fondo" x="${vb[0]-vb[2]}" y="${vb[1]-vb[3]}" width="${vb[2]*3}" height="${vb[3]*3}" data-nivel="ciudad"><title>Volver a ${esc(T.ciudad)}</title></rect>`:'';
  /* dentro de una localidad, tocar fuera de ella (el fondo u otra localidad) vuelve a la ciudad */
  h+=Object.entries(M.loc).map(([cod,l])=>{const [f,o]=relleno(cod);return `<path d="${l.d}" ${S.loc&&S.loc!==cod?'data-nivel="ciudad"':'data-l="'+cod+'"'} fill="${f}" fill-opacity="${S.loc&&S.loc!==cod?.2:o}" class="${S.loc===cod?'activa':''}"><title>${esc(nomLoc(cod))}${S.foco?' · '+p100(porcentajeLoc(cod,S.foco)):''}</title></path>`}).join('');
  const L=S.loc&&BOGOTA_LOC[S.loc];
  if(L){const ps=(L.puestos[S.anio]||[]).filter(p=>p.lat!=null&&p.lon!=null),b=p=>S.corp==='A'?p.alcaldia:p.concejo;
    const parte=p=>{const x=b(p);return x&&x.votos_validos?(x.votos[S.foco]||0)/x.votos_validos:0};  /* solo el tono del punto: no se muestra como cifra */
    const mx=S.foco?Math.max(.0001,...ps.map(parte)):1;
    h+=ps.map(p=>{const x=b(p),g=x&&(S.corp==='A'?x.ganador:x.lista_mas_votada),[cx,cy]=proy(p.lat,p.lon);
      const f=S.foco?(c[S.foco]||COL[0]):(g?(c[g]||css('--otros')):css('--sin')),o=S.foco?.15+.85*parte(p)/mx:1;
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(2.2+Math.sqrt((x?.votos_validos||0)/4000))*k*2}" data-p="${p.id}" fill="${f}" fill-opacity="${o}" class="${S.puesto===p.id?'activo':''}"><title>${esc(p.nombre)}${S.foco?' · '+fmt(x?.votos[S.foco]||0)+' votos':''}</title></circle>`}).join('')}
  else if(!S.loc){h+=Object.entries(M.loc).filter(([cod])=>!rural(cod)).map(([cod,l])=>{const n=nomLoc(cod);return `<text x="${l.bb[0]+l.bb[2]/2}" y="${l.bb[1]+l.bb[3]/2}" text-anchor="middle">${esc(n.length>12?n.split(' ')[0]:n)}</text>`}).join('')}
  svg.innerHTML=h;
  $('#mini').setAttribute('viewBox',M.vbTodo.join(' '));
  $('#mini').innerHTML=Object.entries(M.loc).map(([cod,l])=>{const [f]=relleno(cod);return `<path d="${l.d}" data-l="${cod}" fill="${S.loc===cod?css('--tinta'):f}"><title>${esc(nomLoc(cod))}</title></path>`}).join('');
  if(modoSec()){const usados=[...new Set(Object.keys(SEC).map(c=>lider(c)?.nombre).filter(Boolean))];
    $('#leyenda').innerHTML=usados.map(n=>`<span><i style="background:${colorSec(n)}"></i>${esc((Object.values(SEC)[0].candidaturas.find(c=>c.nombre===n)||{}).nombre_v||n)}</span>`).join('')+` <button class="enlace" data-sec="0">Volver a los resultados</button>`;
    $('#nota-mapa').textContent=`2027, experimental: cada ${T.unidad} va del color de la candidatura con más probabilidad de ser la más votada allí; más intenso, más probable. No es la probabilidad de ganar la alcaldía.`;return}
  if(S.foco){$('#leyenda').innerHTML=`<span><i style="background:${c[S.foco]||COL[0]};opacity:.15"></i>menos</span><span><i style="background:${c[S.foco]||COL[0]}"></i>más votos de ${esc(nombreDe(S.foco))}</span> <button class="enlace" data-foco="">Volver a «quién ganó»</button>`;
    $('#nota-mapa').textContent='Más oscuro, mayor parte de los votos válidos de esa '+(S.corp==='A'?'candidatura':'lista')+'. '+T.rural+' y los puestos pequeños tienen pocos votos: mire los votos en la tabla.';return}
  $('#leyenda').innerHTML=filas(bloque(elecCiudad())).slice(0,6).map((x,i)=>`<span><i style="background:${COL[i]}"></i>${esc(nombre(x))}</span>`).join('')+`<span><i style="background:${css('--otros')}"></i>Otros</span>`;
  $('#nota-mapa').textContent=(S.loc?'Cada punto es un puesto, del color de quien ganó en él; el tamaño, sus votos. Toque un punto para ver el puesto.':`Cada ${T.unidad} va del color de quien ganó en ella; el mapa pequeño muestra ${T.mini.charAt(0).toLowerCase()+T.mini.slice(1)}. Toque ${T.una} para entrar.`)+' Para ver dónde sacó votos cada '+(S.corp==='A'?'candidatura':'lista')+', toque su barra.'+T.mapa_extra}

function barras(b,n){const f=filas(b);if(!f.length)return '<p class="nota">Sin votos registrados.</p>';const c=colores(),max=Math.max(1,...f.map(x=>x.votos));
  const h=f.slice(0,n).map(x=>`<div class="barra${S.foco===x.id?' foco':''}" data-foco="${x.id}" role="button" tabindex="0" title="Ver en el mapa dónde sacó votos"><span>${esc(nombre(x))}${fam(x)}${x.curules!=null?` <span class="fam">${x.curules} ${x.curules===1?'curul':'curules'}</span>`:''}</span><span class="num"><strong>${p100(x.porcentaje_validos)}</strong> · ${fmt(x.votos)}</span>
  <div class="pista"><b style="width:${100*x.votos/max}%;background:${c[x.id]||css('--otros')}"></b></div>${S.corp==='A'?`<small>${esc(x.partido)}</small>`:(x.votos_solo_lista!=null?`<small>${fmt(x.votos_solo_lista)} votos solo por la lista</small>`:'')}</div>`).join('');
  const e=b.especiales||{};
  return h+`<p class="nota">En blanco ${fmt(e.blanco)} · nulos ${fmt(e.nulos)} · no marcados ${fmt(e.no_marcados)}. Porcentajes sobre ${fmt(b.votos_validos)} votos válidos.</p>`}

function candidatos(b){if(S.corp!=='C'||!S.foco)return '';const l=(b?.listas||[]).find(x=>x.id===S.foco);if(!l||!l.candidatos)return '';
  return `<h3>Candidatos de ${esc(l.partido)}</h3><div class="desplaza"><table><tr><th>Candidato</th><th class="n">Votos</th></tr>${l.candidatos.slice(0,15).map(x=>`<tr><td>${esc(x.nombre)}</td><td class="n">${fmt(x.votos)}</td></tr>`).join('')}</table></div>${l.candidatos.length>15?`<p class="nota">Y ${l.candidatos.length-15} más.</p>`:''}`}

function cifras(e,b){return `<div class="cifras"><div><strong>${fmt(e?.potencial)}</strong><span>inscritos (potencial)</span></div><div><strong>${fmt(b?.votos_depositados)}</strong><span>votos en ${S.corp==='A'?'alcaldía':'Concejo'}</span></div><div><strong>${p01(e?.participacion)}</strong><span>participación (alcaldía)</span></div></div>`}

function censo(c){if(!c)return '<p class="nota">Sin censo por sexo ni edad para este puesto en este año.</p>';let h='';
  if(c.mujeres!=null){h+=`<h3>Inscritos por sexo</h3><div class="sexo"><b style="flex:${c.mujeres}"></b><b style="flex:${c.hombres}"></b></div><p class="nota">Mujeres ${fmt(c.mujeres)} · hombres ${fmt(c.hombres)}</p>`}
  if(c.edad){const et={'18_25':'18 a 25','26_40':'26 a 40','41_60':'41 a 60','mas_60':'Más de 60'},ks=Object.keys(et),max=Math.max(1,...ks.map(k=>c.edad[k]||0));
    h+=`<h3>Inscritos por edad</h3><div class="edad">${ks.map(k=>`<b style="height:${100*(c.edad[k]||0)/max}%" title="${fmt(c.edad[k])}"></b>`).join('')}</div><div class="edad-et">${ks.map(k=>`<span>${et[k]}<br>${fmt(c.edad[k])}</span>`).join('')}</div>`}
  else h+='<p class="nota">Sin edad para este año.</p>';
  return h+'<p class="nota">Censo electoral oficial de la Registraduría.</p>'}

const ganador=b=>{const f=filas(b)[0];return f?[nombre(f),p100(f.porcentaje_validos)]:['—','']};

function vistaCiudad(){const e=elecCiudad(),b=bloque(e);
  const tabla=Object.keys(R).sort().map(cod=>{const el=elecLoc(cod),bl=bloque(el),[g,p]=ganador(bl);
    return `<tr class="fila" data-l="${cod}"><td>${esc(nomLoc(cod))}</td><td>${esc(g)}</td><td class="n">${p}</td><td class="n">${fmt(bl?.votos_validos)}</td><td class="n">${p01(el?.participacion)}</td></tr>`}).join('');
  /* Bogotá trae el % del ganador y la participación; Medellín, sus votos y los válidos (una fila por corporación) */
  const filasH=(C.historico||[]).filter(x=>!x.corporacion||x.corporacion==='alcaldia'),hayPct=filasH.some(x=>x.ganador_porcentaje_validos!=null);
  const hist=filasH.map(x=>`<tr><td>${x.anio}</td><td>${esc(x.ganador)}${x.ganador_partido?`<br><span class="nota">${esc(x.ganador_partido)}</span>`:''}</td><td class="n">${hayPct?p100(x.ganador_porcentaje_validos):fmt(x.votos_ganador)}</td><td class="n">${hayPct?p01(x.participacion):fmt(x.validos)}</td></tr>`).join('');
  const op=S.corp==='C'&&b.curul_oposicion?`<p class="nota">${b.curules_total} curules (${esc(b.curules_fuente)}). La curul de la oposición: ${esc(b.curul_oposicion.nombre)} (${esc(b.curul_oposicion.regla)}).</p>`:'';
  const arriba=S.corp==='A'?`<section class="tarjeta" id="escenario-2027">${escHTML}</section>${sectorTarjeta()}`:concejo2027(V.concejo)+concejoAritmetica();
  return `${arriba}<section class="tarjeta"><p class="ante">Ciudad · ${S.anio}</p><h2>${S.corp==='A'?T.alcaldia:T.concejo}</h2>${cifras(e,b)}<p class="nota">Fuente: ${esc(e.fuente)}.</p>
  <h3>${S.corp==='A'?'Candidaturas':'Listas (lista y voto preferente)'}</h3>${barras(b,S.corp==='A'?12:16)}${op}${candidatos(b)}${censo(e.censo)}</section>
  <section class="tarjeta"><h2>${T.Unidades}</h2><p class="nota">Toque una fila para entrar. ${esc(T.sin)}</p>
  <div class="desplaza"><table><tr><th>${T.Unidad}</th><th>Ganó</th><th class="n">%</th><th class="n">Válidos</th><th class="n">Particip.</th></tr>${tabla}</table></div></section>
  <section class="tarjeta"><h2>${T.alcaldia} desde el año 2000</h2><div class="desplaza"><table><tr><th>Año</th><th>Ganó</th><th class="n">${hayPct?'% válidos':'Votos'}</th><th class="n">${hayPct?'Particip.':'Válidos'}</th></tr>${hist}</table></div><p class="nota">${esc(T.historico)}</p></section>`}

function vistaLocalidad(){const L=BOGOTA_LOC[S.loc];if(!L)return `<p class="cargando">Cargando ${T.una}…</p>`;
  const e=L.elecciones[S.anio],b=bloque(e),ps=(L.puestos[S.anio]||[]).slice(),bp=p=>S.corp==='A'?p.alcaldia:p.concejo;
  ps.sort((a,z)=>(bp(z)?.votos_validos||0)-(bp(a)?.votos_validos||0));
  const tabla=ps.map(p=>{const x=bp(p),g=x&&(S.corp==='A'?x.ganador:x.lista_mas_votada);return `<tr class="fila" data-p="${p.id}"><td>${esc(p.nombre)}</td><td>${g?esc(nombreDe(g)):'—'}</td><td class="n">${fmt(x?.votos_validos)}</td><td class="n">${p01(p.participacion)}</td></tr>`}).join('');
  return `${sectorParte(S.loc)}<section class="tarjeta"><p class="ante">${T.Unidad} · ${S.anio}</p><h2>${esc(L.territorio.nombre)}</h2>${cifras(e,b)}<h3>${S.corp==='A'?'Candidaturas':'Listas'}</h3>${barras(b,S.corp==='A'?10:12)}${candidatos(b)}${censo(e.censo)}</section>
  <section class="tarjeta"><h2>Los ${ps.length} puestos de ${S.anio}</h2><p class="nota">Toque uno para verlo. Un puesto agrupa a los inscritos en él: no es el barrio que nombra.</p>
  <div class="desplaza"><table><tr><th>Puesto</th><th>Ganó</th><th class="n">Válidos</th><th class="n">Particip.</th></tr>${tabla}</table></div></section>`}

function parDe(p){const out=[];
  if('puesto_2023' in p)out.push(['2023',p.puesto_2023]);if('puesto_2019' in p)out.push(['2019',p.puesto_2019]);
  const L=BOGOTA_LOC[S.loc];for(const a of ANIOS){if(a===S.anio)continue;for(const q of L.puestos[a]||[]){if(q[`puesto_${S.anio}`]===p.id)out.push([a,q.id])}}
  return out}

function vistaPuesto(){const L=BOGOTA_LOC[S.loc];if(!L)return vistaLocalidad();const p=(L.puestos[S.anio]||[]).find(x=>x.id===S.puesto);if(!p)return vistaLocalidad();
  const x=S.corp==='A'?p.alcaldia:p.concejo,v=Object.entries(x?.votos||{}).sort((a,z)=>z[1]-a[1]),c=colores(),max=Math.max(1,...v.map(z=>z[1]));
  const bars=v.slice(0,10).map(([id,n])=>`<div class="barra"><span>${esc(nombreDe(id))}</span><span class="num">${fmt(n)}</span><div class="pista"><b style="width:${100*n/max}%;background:${c[id]||css('--otros')}"></b></div></div>`).join('');
  const es=x?.especiales||{};
  const pares=parDe(p).map(([a,id])=>id?`<p class="nota">En ${a} se compara con el puesto ${esc(id)}. <button class="enlace" data-ir="${a}|${esc(id)}">Verlo</button></p>`:`<p class="nota">Sin par seguro en ${a}: no se compara con ningún puesto.</p>`).join('');
  return `<section class="tarjeta"><p class="ante">Puesto ${esc(p.id)} · ${esc(L.territorio.nombre)} · ${S.anio}</p><h2>${esc(p.nombre)}</h2>
  <p class="aviso">Votan aquí los inscritos en este puesto; no es el barrio.</p>
  <div class="cifras"><div><strong>${fmt(p.potencial)}</strong><span>inscritos</span></div><div><strong>${fmt(x?.votos_depositados??x?.votos_validos)}</strong><span>${x?.votos_depositados!=null?'votos':'votos válidos'} en ${S.corp==='A'?'alcaldía':'Concejo'}</span></div><div><strong>${p01(p.participacion)}</strong><span>participación (alcaldía)</span></div></div>
  <p class="nota">${fmt(p.mesas)} mesas.${p.lat==null?' Sin coordenada: no aparece en el mapa.':''}${S.corp==='A'&&x?.margen_puntos_validos!=null?` Margen entre los dos primeros: ${Number(x.margen_puntos_validos).toLocaleString('es-CO',{maximumFractionDigits:1})} puntos de los votos válidos.`:''}</p>
  <h3>${S.corp==='A'?'Candidaturas':'Listas'}: votos en el puesto</h3>${bars||'<p class="nota">Sin votos registrados.</p>'}
  <p class="nota">En blanco ${fmt(es.blanco)} · nulos ${fmt(es.nulos)} · no marcados ${fmt(es.no_marcados)} · ${fmt(x?.votos_validos)} votos válidos.</p>${censo(p.censo)}${pares}</section>`}

let escHTML='';
function escenarios(){const x=V.esc,el={set innerHTML(h){escHTML=h}};  /* se pinta arriba del panel de la ciudad */
  if(!x){el.innerHTML=`<p class="ante">Escenarios 2027 · nivel: contrato</p><h2>Escenarios en preparación</h2><p class="aviso">Los escenarios 2027 de la alcaldía de ${esc(T.ciudad)} los prepara el equipo del Estudio. Cuando estén sellados aparecen aquí, con sus supuestos y sus fuentes. No se muestra nada antes.</p>`;return}
  const pr=v=>v==null?'—':p100(100*v);
  const asp=(x.aspirantes||[]).map(a=>`<div class="esc-asp">${avatar(a.nombre_v||a.nombre,V.fotos[a.clave],V.fotoRaiz)}<span><strong${a.sin_nombre?' style="font-style:italic"':''}>${esc(a.nombre_v||a.nombre)}</strong>${credito(V.fotos[a.clave])}${a.partido_v?`<br><span class="nota">${esc(a.partido_v)}</span>`:''}${a.estado?` <span class="fam">${esc(a.estado)}</span>`:''}${a.sin_nombre?'<br><span class="nota">Sin nombre: la fuente solo dice que el partido llevará candidato propio.</span>':''}</span><span class="num"><strong>${pr(a.p_ganar)}</strong>${a.rango?`<br><span class="nota">${pr(a.rango[0])} a ${pr(a.rango[1])}</span>`:''}</span>
  ${(a.fuentes||[]).length?`<span class="nota ultimo">${a.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.texto||'fuente')}</a>`).join(' · ')}</span>`:''}</div>`).join('');
  const lista=(t,a)=>a&&a.length?`<h3>${t}</h3><ul class="nota">${a.map(s=>`<li>${esc(typeof s==='string'?s:(s.texto||JSON.stringify(s)))}</li>`).join('')}</ul>`:'';
  el.innerHTML=`<p class="ante">Escenarios 2027 · nivel: contrato · ${esc(x.marca||V.sello)}</p><h2>${T.alcaldia} 2027</h2>
  <p class="nota">Modelo ${esc(x.modelo||'')} · corrida del ${esc(x.generado||'')}${x.preregistro?.sha256?` · sello ${esc(x.preregistro.sha256.slice(0,12))}`:''}</p>${x.advertencia?`<p class="aviso">${esc(x.advertencia)}</p>`:''}
  ${x.variante?`<p class="nota"><strong>Variante:</strong> ${esc(x.variante)}</p>`:''}
  ${asp||'<p class="nota">La corrida no trae aspirantes.</p>'}<p class="nota">La probabilidad es la media del modelo en sus réplicas y va siempre con su rango; no es una encuesta ni una intención de voto.</p>
  ${typeof x.estabilidad_favorito==='number'?`<p class="nota">${esc(x.favorito_v||x.favorito)} lidera en ${pr(x.estabilidad_favorito)} de las réplicas. Esa estabilidad no es una probabilidad de ganar.</p>`:(x.estabilidad_favorito?.texto?`<p class="nota">${esc(x.estabilidad_favorito.texto)}</p>`:'')}
  ${lista('Qué voltea al favorito',x.puntos_quiebre)}${lista('Lo que no se sabe',x.no_se_sabe)}${lista('Supuestos',x.supuestos)}${retro(x.retro_bogota)}
  ${x.concejo?'<p class="nota">La aritmética de curules del Concejo 2023 está en el panel del Concejo.</p>':''}`}

function retro(r){if(!r||!r.length)return '';
  return `<h3>El v0.6 frente a las elecciones reales de ${esc(T.ciudad)}</h3><div class="desplaza"><table><tr><th>Carrera</th><th>Ganó</th><th>Favorito del modelo</th><th>¿Acertó?</th></tr>${r.map(c=>`<tr><td>${esc(c.carrera)}</td><td>${esc(c.ganador_real_v||c.ganador_real)}</td><td>${c.favorito_v06?esc(c.favorito_v06_v||c.favorito_v06):'Sin favorito único: '+esc((c.empatados_v||c.empatados||[]).join(', '))}</td><td>${c.acierta===true?'Sí':c.acierta===false?'No':'—'}</td></tr>`).join('')}</table></div><p class="nota">Dos carreras: un chequeo de cordura, no una validación.</p>`}

function concejoAritmetica(){const k=V.esc?.concejo;if(!k||S.corp!=='C')return '';
  const nom=id=>{const l=(C.elecciones['2023'].concejo.listas||[]).find(x=>x.id===id);return l?l.partido:id};
  const filas=(k.listas||[]).map(l=>`<tr><td>${esc(nom(l.id))}</td><td class="n">${fmt(l.votos_2023)}</td><td class="n">${fmt(l.curules)}</td><td class="n">${l.votos_para_una_curul_mas!=null?fmt(l.votos_para_una_curul_mas):'—'}</td><td class="n">${l.votos_para_el_umbral!=null?`faltan ${fmt(l.votos_para_el_umbral)} para el umbral`:(l.votos_que_puede_perder!=null?fmt(l.votos_que_puede_perder):'—')}</td></tr>`).join('');
  return `<section class="tarjeta"><p class="ante">Estudio · nivel: contrato · ${esc(V.esc.marca||V.sello)}</p><h2>Concejo: aritmética de curules sobre 2023</h2>
  <p class="aviso">${esc(k.tipo||'Aritmética, no probabilidad')}.</p>
  <div class="cifras"><div><strong>${fmt(k.umbral)}</strong><span>umbral</span></div><div><strong>${fmt(k.cifra_repartidora)}</strong><span>cifra repartidora</span></div><div><strong>${fmt(k.por_cifra_repartidora)} + 1</strong><span>curules (la ${fmt(k.curules)}, de la oposición)</span></div></div>
  <p class="nota">Última curul: ${esc(nom(k.ultima_curul?.id))}. Siguiente en la fila: ${esc(nom(k.siguiente_en_la_fila?.id))}${k.siguiente_en_la_fila?.cociente!=null?` (cociente ${fmt(k.siguiente_en_la_fila.cociente)})`:''}. ${esc(k.curul_oposicion||'')}</p>
  <div class="desplaza"><table><tr><th>Lista</th><th class="n">Votos 2023</th><th class="n">Curules</th><th class="n">Para una más</th><th class="n">Puede perder</th></tr>${filas}</table></div>
  <p class="nota">${esc(k.como_leer||'')} ${esc(k.escalado||'')}</p></section>`}

function migas(){const m=[`<button data-nivel="ciudad">${esc(T.ciudad)}</button>`];if(S.loc)m.push(S.puesto?`<button data-nivel="loc">${esc(nomLoc(S.loc))}</button>`:`<strong>${esc(nomLoc(S.loc))}</strong>`);
  if(S.puesto){const p=BOGOTA_LOC[S.loc]?.puestos[S.anio]?.find(x=>x.id===S.puesto);m.push(`<strong>${esc(p?p.nombre:S.puesto)}</strong>`)}$('#migas').innerHTML=m.join(' › ')}

function pintar(){if(S.loc&&!BOGOTA_LOC[S.loc]){const cod=S.loc;cargar(cod,()=>{if(S.loc===cod)pintar()})}
  if(S.puesto&&BOGOTA_LOC[S.loc]&&!(BOGOTA_LOC[S.loc].puestos[S.anio]||[]).some(p=>p.id===S.puesto))S.puesto=null;
  $('#anios').innerHTML=ANIOS.map(a=>`<button data-a="${a}" aria-pressed="${a===S.anio}">${a}</button>`).join('');
  document.querySelectorAll('#corps button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===S.corp));
  $('#volver-mapa').hidden=!S.loc;
  escenarios();migas();mapa();$('#panel').innerHTML=S.puesto?vistaPuesto():S.loc?vistaLocalidad():vistaCiudad()}

document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a],[data-c],[data-l],[data-p],[data-nivel],[data-ir],[data-foco],[data-sec]');if(!t)return;
  const bajar=!!(t.closest('#panel')||t.closest('svg'));  /* antes de pintar: pintar reemplaza el nodo tocado */
  if(t.dataset.foco!==undefined){ir({foco:t.dataset.foco&&t.dataset.foco!==S.foco?t.dataset.foco:null,sec:false});return}
  if(t.dataset.sec!==undefined){ir({sec:t.dataset.sec==='1',foco:null});return}
  if(t.dataset.a)ir({anio:t.dataset.a});else if(t.dataset.c)ir({corp:t.dataset.c});
  else if(t.dataset.nivel)ir(t.dataset.nivel==='ciudad'?{loc:null,puesto:null}:{puesto:null});
  else if(t.dataset.ir){const [a,id]=t.dataset.ir.split('|');ir({anio:a,puesto:id})}
  else if(t.dataset.p)ir({puesto:t.dataset.p});else if(t.dataset.l)ir({loc:t.dataset.l,puesto:null});
  if(bajar){if(innerWidth<=820)$('#panel').scrollIntoView({behavior:'smooth'});else scrollTo({top:0,behavior:'smooth'})}});
addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if(S.puesto)ir({puesto:null});else if(S.loc)ir({loc:null})});  /* Esc sube un nivel */
addEventListener('hashchange',()=>{leerHash();pintar()});leerHash();pintar();
</script>
