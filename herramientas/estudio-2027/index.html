52115894130750656},"supuesto":"siempre en la tarjeta","fuentes":[],"nombre_v":"Voto en blanco","partido_v":null,"clave":"VOTOS EN BLANCO","sin_nombre":false}],"estabilidad_favorito":1.0,"puntos_quiebre":["DANIEL CARVALHO MEJIA lidera si su etiqueta tuviera en 2023 una cuota ≥ 0.33 (bajo β mediana).","ANIBAL GAVIRIA CORREA lidera si su etiqueta tuviera en 2023 una cuota ≥ 0.33 (bajo β mediana).","ESTEBAN RESTREPO TABORDA lidera si su etiqueta tuviera en 2023 una cuota ≥ 0.33 (bajo β mediana).","Si MANUEL VILLA MEJIA no se inscribe, el favorito pasa a ser empate entre ANIBAL GAVIRIA CORREA, DANIEL CARVALHO MEJIA, ESTEBAN RESTREPO TABORDA."],"supuestos":["Manuel Villa es el candidato del oficialismo y Andrés Tobón no se inscribe por aparte (la puja es entre los dos y Tobón condiciona su aspiración al aval). (360 Radio 2026-10-21, https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/; Gran Ciudad 2026-10-21, https://www.granciudad.net/soy-el-mejor-candidato-y-no-voy-a-renunciar-al-concejo-andres-tobon-villada/)","Creemos no tiene personería jurídica: el Consejo de Estado la anuló en 2024, no la recuperó en el Senado 2026 y no figura en el registro del CNE. Solo puede inscribir por firmas o con aval de otro partido. (CNE, registro de partidos y movimientos con personería vigente (corte 2026-10-07), https://www.cne.gov.co/index.php/partidos-movimientos-politicos-y-grupos-significativos/778; Consejo de Estado, comunicado 2024-04-18, https://www.consejodeestado.gov.co/news/2024/18.2-Abr-2024.php; IFM Noticias 2026-03, https://ifmnoticias.com/medellin/movimiento-creemos-no-alcanzo-el-umbral-para-el-senado-y-continuara-sin-personeria-juridica/)","Variante A (base): Villa va por firmas con el nombre «Creemos», como el movimiento fue al Congreso en 2026. (Infobae 2025-12-04, https://www.infobae.com/colombia/2025/12/04/movimiento-de-fico-gutierrez-inscribio-sus-listas-al-congreso-con-mas-de-800000-firmas-juliana-gutierrez-encabeza-la-del-senado/; 360 Radio 2026-10-21, https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/)","Variante B: Villa va con aval de Defensores de la Patria, el partido que representaría la eventual fusión con Salvación Nacional y Creemos. (El Colombiano 2026-09-28, https://www.elcolombiano.com/colombia/politica/posible-fusion-creemos-salvacion-nacional-defensores-de-la-patria-detalles-que-paso-PD41607019; Semana 2026-10-03, https://www.semana.com/confidenciales/articulo/batalla-por-la-alcaldia-de-medellin-los-candidatos-que-suenan-para-2027/202607/)","Sebastián López compite con aval del Centro Democrático, sin alianza con Creemos. (El Colombiano 2026-05-04, https://www.elcolombiano.com/inicio/concejo-de-medellin-elecciones-sebastian-lopez-GH36134376; El Colombiano 2026-08-16, https://www.elcolombiano.com/inicio/elecciones-alcaldia-medellin-candidatos-derecha-uribismo-creemos-EK39993513)","Daniel Carvalho compite por Dignidad & Compromiso. (El Colombiano 2026-04-06, https://www.elcolombiano.com/colombia/daniel-carvalho-habla-de-las-elecciones-a-presidencia-FH35236470 (aval: Pulzo 2026-10-10))","Aníbal Gaviria compite por la Alcaldía, con etiqueta desconocida. (Semana 2026-10-03, https://www.semana.com/confidenciales/articulo/batalla-por-la-alcaldia-de-medellin-los-candidatos-que-suenan-para-2027/202607/)","José Luis Marín es el candidato del Pacto Histórico y Esteban Restrepo el del bloque de Quintero. (Punto de Vista RDB 2026-10-05, https://www.puntodevistardb.com/2026/10/en-medellin-y-antioquia-dieciseis-aspirantes-para-dos-despachos/; 360 Radio 2026-10-21, https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/)"],"no_se_sabe":["Si el oficialismo va por firmas con el nombre «Creemos» (variante A) o con el aval de Defensores de la Patria o del partido que salga de la fusión (variante B). Ninguna fuente lo define y la fusión se presentaría al CNE a comienzos de 2027.","Si Tobón u otro fiquista compite por aparte, o si el Centro Democrático y Creemos repiten la alianza de 2023 (El Colombiano 2026-08-16 lo pone en duda).","Si López va con aval del CD o por firmas (360 Radio lo cree probable por firmas).","Si Gaviria va a la Alcaldía o a la Gobernación, y con qué etiqueta.","Quién es el candidato del bloque de Quintero y si hay consulta entre Pacto, Verdes y liberales.","El modelo es un logit: no ve la división del voto. Dos candidatos del mismo bloque no se quitan votos entre sí en el modelo.","El modelo solo ve la etiqueta de 2027, la historia 2023 de esa etiqueta y la del candidato. No ve encuestas, gobierno departamental, dinero, maquinaria ni la popularidad del alcalde saliente.","Las inscripciones son a mediados de 2027: cualquier aspirante puede entrar o salir y cualquier etiqueta puede cambiar."],"lectura":"La carrera visible es la sucesión de Federico Gutiérrez, que no puede reelegirse: Manuel Villa es su favorito y Andrés Tobón aspira solo si recibe el aval de Creemos. El Centro Democrático define avales antes de terminar 2026 y su nombre más fuerte es Sebastián López. Por fuera del uribismo: Daniel Carvalho (declarado), Aníbal Gaviria (duda entre Alcaldía y Gobernación) y el bloque de Quintero, sin candidato definido. Hay 19 nombres con fuente; la carrera supuesta toma los seis con evidencia más sólida por bloque.","preregistro":{"sha256":"c43797be81c9cacce72b7a40922094f3370c39b07b3a274ca2c5b10c0f3a61fc","fecha":"2026-10-22","ots":"preregistros/escenarios-2027/MANIFIESTO-2026-10-22.txt.ots","id":"escenario-2027-medellin-2026-10-22","archivo":"preregistros/escenarios-2027/medellin-2026-10-22.json"},"lista_aspirantes":[{"nombre":"MANUEL VILLA MEJIA","estado":"mencionado","partido_probable":"PARTIDO POLÍTICO CREEMOS","cargo_publico_reciente":"secretario de Seguridad y Convivencia 2024- (renuncia anunciada por prensa, no confirmada al 2026-10-22)","fuente":"360 Radio 2026-10-21","url":"https://360radio.com.co/manuel-villa-candidato-alcaldia-medellin-2027/235379/","fecha_fuente":"2026-10-21","confianza":" <script>
const V=JSON.parse(document.getElementById('vista').textContent);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('es-CO');
const pr=v=>v==null?'—':(100*v).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL=['--c0','--c1','--c2','--c3','--c4','--c5'].map(css);

function iniciales(n){const w=String(n||'').split(/\s+/).filter(x=>x&&!/^(de|del|la|las|los|y)$/i.test(x));if(!w.length)return '';return (w[0][0]+(w.length>=4?w[2][0]:w.length>1?w[w.length-1][0]:'')).toUpperCase()}  /* nombre y primer apellido */
function avatar(nombre,foto,raiz){return `<span class="avatar" aria-hidden="true">${foto?`<img src="${raiz}${esc(foto.archivo)}" alt="" loading="lazy">`:esc(iniciales(nombre))}</span>`}
function credito(foto){return foto?`<div class="credito">Foto: <a href="${esc(foto.url)}" target="_blank" rel="noopener">${esc(foto.autor)}</a>, ${foto.licencia_url?`<a href="${esc(foto.licencia_url)}" target="_blank" rel="noopener license">${esc(foto.licencia)}</a>`:esc(foto.licencia)}, Wikimedia Commons (adaptada)</div>`:''}

const CRITERIOS={'1_rps_menor_que_persistencia':'Reparte las curules mejor que suponer que se repite 2023 (RPS)',
  '2_brier_menor_que_persistencia':'Acierta mejor qué listas sacan al menos una curul (Brier)',
  '3_cobertura_80_entre_70_y_90':'El rango del 80 % acierta entre 70 % y 90 % de las veces'};
function concejo2027(k){if(!k||!k.listas)return '';
  const f=(x,d=1)=>x==null?'—':Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
  const pc=x=>x==null?'—':f(100*x)+' %';
  const listas=k.listas.filter(l=>l.id!=='blanco'),blanco=k.listas.find(l=>l.id==='blanco');
  const filas=listas.map(l=>{const ps=Object.entries(l.p_curules||{}).map(([n,p])=>[+n,p]),max=Math.max(1,...ps.map(z=>z[0])),pm=Math.max(.0001,...ps.map(z=>z[1]));
    const barras=Array.from({length:max+1},(_,n)=>{const p=(ps.find(z=>z[0]===n)||[0,0])[1];return `<b class="${n===l.curules_2023?'ref':''}" style="height:${Math.max(2,100*p/pm)}%" title="${n} curules: ${pc(p)}"></b>`}).join('');
    return `<tr><td>${esc(l.partido_v||l.partido)}${l.alerta?`<br><span class="alerta-lista">⚠ ${esc(l.alerta)}</span>`:''}</td><td class="n">${l.curules_2023??'—'}</td><td class="n"><strong>${f(l.curules_esperadas)}</strong></td><td class="n">${l.curules_rango_80?l.curules_rango_80[0]+' a '+l.curules_rango_80[1]:'—'}</td><td class="n">${pc(l.p_pasa_umbral)}</td><td><div class="dist" aria-label="Probabilidad de cada número de curules">${barras}</div></td></tr>`}).join('');
  const v=k.validacion||{},m=(v.medidas_antioquia_125||{}).modelo||{};
  const crit=Object.entries(v.criterios||{}).map(([c,ok])=>`<p class="criterio">${ok?'✔':'✘'} ${esc(CRITERIOS[c]||c)}</p>`).join('');
  return `<section class="tarjeta"><p class="ante">Concejo 2027 · nivel: contrato · ${esc(k.marca||'')}</p>
  <h2>Concejo 2027 <span class="estado-metodo">Método ${esc(k.estado_metodo||'sin estado')}</span></h2>
  <p class="nota">Modelo ${esc(k.modelo||'')} · corrida del ${esc(k.generado||'')}${k.preregistro?.sha256?` · sello ${esc(k.preregistro.sha256.slice(0,12))}`:''}</p>
  <p class="aviso"><strong>Supuesto:</strong> ${esc((k.supuestos||[])[0]||'se repiten las listas de 2023')}</p>
  ${k.advertencia?`<p class="nota">${esc(k.advertencia)}</p>`:''}
  <p class="nota">${f(k.curules_por_repartir,0)} curules por cifra repartidora, más ${esc(k.curul_oposicion||'la de oposición')}. Umbral supuesto: ${f(k.umbral_supuesto,0)} votos, sobre ${f(k.validos_supuestos,0)} válidos de 2023.</p>
  <div class="desplaza"><table><tr><th>Lista</th><th class="n">Curules 2023</th><th class="n">Esperadas</th><th class="n">Rango 80 %</th><th class="n">Pasa el umbral</th><th>Cuántas curules (gris: las de 2023)</th></tr>${filas}</table></div>
  ${blanco?`<p class="nota">Voto en blanco: ${pc(blanco.cuota_media)} de los válidos (rango ${pc(blanco.cuota_rango?.[0])} a ${pc(blanco.cuota_rango?.[1])}).</p>`:''}
  <h3>Por qué es «${esc(k.estado_metodo||'')}»</h3>${crit}<p class="nota">Medido en 2019 → 2023 en ${m.municipios??'—'} municipios de Antioquia: el rango del 80 % de las curules acertó ${pc(m.cobertura_80_curules)} de las veces. Los números no dicen quién de cada lista queda electo.</p></section>`}

let actual=(location.hash.slice(1)&&V.munis.find(m=>m.cod===location.hash.slice(1)))?location.hash.slice(1):V.munis[0].cod;

function mapa(m){const svg=$('#mapa');svg.setAttribute('viewBox',m.vb.join(' '));const col={};m.orden.forEach((n,i)=>col[n]=COL[i]);
  let h=`<path class="muni" d="${m.d}"/>`;
  if(m.comunas)h+=m.comunas.map(c=>`<path class="comuna" d="${c.d}"><title>${esc(c.n)}</title></path>`).join('')+m.comunas.map(c=>`<text x="${c.c[0]}" y="${c.c[1]}" text-anchor="middle">${esc(c.n)}</text>`).join('');
  h+=m.puestos.map(p=>`<circle cx="${p.xy[0]}" cy="${p.xy[1]}" r="${(2+Math.sqrt((p.v||0)/2500)).toFixed(1)}" fill="${p.g?(col[p.g]||css('--otros')):css('--sin')}"><title>${esc(p.n)} · ganó ${esc(m.nombres[p.g]||p.g||'empate')}${p.m!=null?' por '+p.m.toLocaleString('es-CO')+' puntos':''}</title></circle>`).join('');
  svg.innerHTML=h;
  $('#leyenda').innerHTML=m.orden.map((n,i)=>`<span><i style="background:${COL[i]}"></i>${esc(m.nombres[n]||n)}</span>`).join('')+`<span><i style="background:${css('--otros')}"></i>Otros</span>`;
  $('#nota-mapa').textContent=`Alcaldía 2023: cada punto es un puesto de votación, del color de quien ganó en él; el tamaño, sus votos válidos. ${m.puestos.length} puestos con coordenada`+(m.excluidos?` (${m.excluidos} sin coordenada no salen).`:'.')+(m.cod==='05001'?(m.comunas?' Las líneas punteadas son las comunas y corregimientos.':' Las comunas y corregimientos se suman cuando IPET entregue su geometría.'):'')+' Un puesto agrupa a los inscritos en él: no es el barrio.'}

function lista(t,a){return a&&a.length?`<h3>${t}</h3><ul class="nota">${a.map(s=>`<li>${esc(typeof s==='string'?s:(s.texto||JSON.stringify(s)))}</li>`).join('')}</ul>`:''}

function panel(m){const x=m.esc,asp=x.aspirantes||[];
  const filas=asp.map(a=>{const foto=V.fotos[a.clave];return `<div class="asp">${avatar(a.nombre_v,foto,V.fotoRaiz)}<span><strong${a.sin_nombre?' style="font-style:italic"':''}>${esc(a.nombre_v)}</strong>${a.partido?`<br><span class="nota">${esc(a.partido_v)}</span>`:''}${a.estado?` <span class="fam">${esc(a.estado)}</span>`:''}${credito(foto)}
    ${(a.fuentes||[]).length?`<div class="nota">${a.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.texto||'fuente')}</a>`).join(' · ')}</div>`:''}</span>
    <span class="num"><strong>${pr(a.p_ganar)}</strong>${a.rango?`<br><span class="nota">${pr(a.rango[0])} a ${pr(a.rango[1])}</span>`:''}</span>
    ${a.rango?`<div class="pista" aria-hidden="true"><b style="left:${100*a.rango[0]}%;right:${100-100*a.rango[1]}%"></b><i style="left:calc(${100*a.p_ganar}% - 1px)"></i></div>`:''}</div>`}).join('');
  const est=typeof x.estabilidad_favorito==='number'?`<p class="nota">${esc(x.favorito_v||x.favorito)} lidera en ${pr(x.estabilidad_favorito)} de las réplicas. Esa estabilidad no es una probabilidad de ganar.</p>`:(x.estabilidad_favorito?.texto?`<p class="nota">${esc(x.estabilidad_favorito.texto)}</p>`:'');
  const sonajero=(x.lista_aspirantes||[]).filter(a=>!asp.some(b=>b.clave===a.clave));
  return `<section class="tarjeta"><p class="ante">Alcaldía 2027 · ${esc(x.marca||V.sello)}</p><h2>${esc(m.nombre)}</h2>
  <p class="nota">Modelo ${esc(x.modelo||'')} · corrida del ${esc(x.generado||'')}${x.preregistro?.sha256?` · sello ${esc(x.preregistro.sha256.slice(0,12))}`:''}${x.variante?` · variante: ${esc(x.variante)}`:''}</p>
  ${x.advertencia?`<p class="aviso">${esc(x.advertencia)}</p>`:''}
  ${filas||'<p class="aviso">Sin carrera con fuente: ningún aspirante tiene todavía una fuente pública que lo nombre. El modelo no se corre sobre una carrera inventada.</p>'}
  ${filas?'<p class="nota">La probabilidad es la media del modelo en sus réplicas; la barra muestra su rango. No es una encuesta ni una intención de voto.</p>':''}
  ${est}${x.lectura?`<h3>Lectura</h3><p>${esc(x.lectura)}</p>`:''}${lista('Qué voltea al favorito',x.puntos_quiebre)}${lista('Lo que no se sabe',x.no_se_sabe)}${lista('Supuestos',x.supuestos)}</section>
  ${sonajero.length?`<section class="tarjeta"><h2>Otros nombres con fuente</h2><p class="nota">Aparecen en fuentes públicas pero no entran a la carrera supuesta.</p><div class="lista">${sonajero.map(a=>{const foto=V.fotos[a.clave];return `<div>${avatar(a.nombre_v,foto,V.fotoRaiz)}<span><strong>${esc(a.nombre_v)}</strong>${a.partido_probable?`<br><span class="nota">${esc(a.partido_probable)}</span>`:''}${credito(foto)}</span></div>`}).join('')}</div></section>`:''}
  ${concejo2027(m.concejo)}${concejo(x.concejo)}${m.cod==='05001'?'<section class="tarjeta"><h2>Medellín por comunas y corregimientos</h2><p class="nota">Alcaldía y Concejo 2019 y 2023 por comuna y por puesto, con el mapa de las 16 comunas y los 5 corregimientos.</p><p><a class="boton-ir" href="../medellin/index.html">Abrir Medellín por comunas →</a></p></section>':''}`}

function concejo(k){if(!k||!k.listas)return '';
  const filas=k.listas.map(l=>`<tr><td>${esc(l.partido)}</td><td class="n">${fmt(l.votos_2023)}</td><td class="n">${fmt(l.curules)}</td><td class="n">${l.votos_para_una_curul_mas!=null?fmt(l.votos_para_una_curul_mas):'—'}</td><td class="n">${l.votos_para_el_umbral!=null?'faltan '+fmt(l.votos_para_el_umbral)+' para el umbral':(l.votos_que_puede_perder!=null?fmt(l.votos_que_puede_perder):'—')}</td></tr>`).join('');
  return `<section class="tarjeta"><h2>Concejo: aritmética de curules sobre 2023</h2><p class="aviso">${esc(k.tipo||'Aritmética, no probabilidad')}.</p><div class="desplaza"><table><tr><th>Lista</th><th class="n">Votos 2023</th><th class="n">Curules</th><th class="n">Para una más</th><th class="n">Puede perder</th></tr>${filas}</table></div><p class="nota">${esc(k.como_leer||'')}</p></section>`}

function pintar(){const m=V.munis.find(x=>x.cod===actual);
  $('#selector').innerHTML=V.munis.map(x=>`<button data-m="${x.cod}" aria-pressed="${x.cod===actual}">${esc(x.nombre)}</button>`).join('')+'<a href="../bogota/index.html">Bogotá →</a>';
  mapa(m);$('#panel').innerHTML=panel(m)}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-m]');if(!b)return;actual=b.dataset.m;history.replaceState(null,'','#'+actual);pintar();if(innerWidth<=820)$('#selector').scrollIntoView({behavior:'smooth'})});
addEventListener('hashchange',()=>{const c=location.hash.slice(1);if(V.munis.some(m=>m.cod===c)){actual=c;pintar()}});
pintar();
</script>
