<style>
/* Plantilla de modelo/pulso_admin.py. Tokens del sistema de diseño CivisLab (maqueta del 22-oct). */
:root{
  --papel:#f4f5f2;--superficie:#fff;--superficie-2:#eef1ec;--linea:#d8ded6;--linea-2:#bfc9be;
  --tinta:#1d2422;--tinta-2:#4c5752;--tinta-3:#65706b;--acento:#2b4b48;--acento-suave:#e2ebe0;
  --real:#2b4b48;--real-fondo:#e2ebe0;--aviso:#7e5f14;--aviso-fondo:#f6edd6;--priv:#7a2d22;--priv-fondo:#f6e3df;
  --seq-0:#eef3eb;--seq-1:#2b4b48;--sube:#b4553b;--baja:#2e6e8e;--sin-dato:#e9ebe8;
  --font:"Montserrat","Helvetica Neue",Arial,system-ui,sans-serif;--ancho:1240px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#0f1716;--superficie:#16201e;--superficie-2:#1c2826;--linea:#2a3935;--linea-2:#3a4c47;
  --tinta:#e8eeea;--tinta-2:#b5c2bc;--tinta-3:#93a29b;--acento:#a9c98f;--acento-suave:#22332b;
  --real:#a9c98f;--real-fondo:#1f2e25;--aviso:#e4bc6a;--aviso-fondo:#2c2415;--priv:#f0a090;--priv-fondo:#3a1f1a;
  --seq-0:#1c2826;--seq-1:#b7d6a0;--sube:#d9774f;--baja:#5fa8cf;--sin-dato:#1e2826;color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#0f1716;--superficie:#16201e;--superficie-2:#1c2826;--linea:#2a3935;--linea-2:#3a4c47;
  --tinta:#e8eeea;--tinta-2:#b5c2bc;--tinta-3:#93a29b;--acento:#a9c98f;--acento-suave:#22332b;
  --real:#a9c98f;--real-fondo:#1f2e25;--aviso:#e4bc6a;--aviso-fondo:#2c2415;--priv:#f0a090;--priv-fondo:#3a1f1a;
  --seq-0:#1c2826;--seq-1:#b7d6a0;--sube:#d9774f;--baja:#5fa8cf;--sin-dato:#1e2826;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 15px/1.5 var(--font)}
.marco{max-width:var(--ancho);margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:.005em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.ante{font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
.nota{font-size:13px;color:var(--tinta-3);line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.cab{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--linea)}
.cab .lema{color:var(--tinta-2);max-width:60ch;margin-top:6px}
.sellos{display:flex;flex-wrap:wrap;gap:6px}
.sello{font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:3px;border:1px solid currentColor}
.sello.real{color:var(--real);background:var(--real-fondo)}
.sello.aviso{color:var(--aviso);background:var(--aviso-fondo)}
.sello.priv{color:var(--priv);background:var(--priv-fondo)}
.controles{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
select{font:inherit;padding:8px 10px;border:1px solid var(--linea-2);border-radius:4px;background:var(--superficie);color:var(--tinta);min-width:220px}
.pestanas{display:flex;flex-wrap:wrap;gap:4px;background:var(--superficie-2);padding:4px;border-radius:6px}
.pestanas button{font:600 13px/1 var(--font);border:0;background:transparent;color:var(--tinta-2);padding:9px 12px;border-radius:4px;cursor:pointer}
.pestanas button[aria-selected="true"]{background:var(--superficie);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pestanas button .k{font-weight:500;color:var(--tinta-3);margin-left:6px}
.panel{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel>*,.tarjeta{min-width:0}
.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:8px;padding:18px}
.tarjeta>h2,.tarjeta>h3{margin-bottom:4px}
.tarjeta>.nota{margin-bottom:12px}
.rejilla{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font);padding:6px 9px;border-radius:999px;background:var(--superficie-2);color:var(--tinta-2)}
.chip.ok{background:var(--real-fondo);color:var(--real)}
.chip.poca{background:var(--aviso-fondo);color:var(--aviso)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tema{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linea)}
.tema:last-child{border-bottom:0}
.tema .barra{height:12px;background:var(--acento);border-radius:2px;min-width:2px}
.tema .pista{background:var(--superficie-2);border-radius:2px}
.tema button{font:inherit;font-size:12px;border:0;background:none;color:var(--tinta-3);cursor:pointer;text-decoration:underline;padding:0}
.tend{font:700 12px/1 var(--font);white-space:nowrap}
.tend.sube{color:var(--sube)}.tend.baja{color:var(--baja)}.tend.otra{color:var(--tinta-3);font-weight:500}
.enlaces{grid-column:1/-1;font-size:13px;color:var(--tinta-2);display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0 6px}
.enlaces a{color:var(--tinta-2)}
.mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mini .tarjeta{padding:14px;cursor:pointer}
.mini .tarjeta:hover{border-color:var(--linea-2)}
.desplaza{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:middle}
th{color:var(--tinta-3);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.calor td.c{text-align:center;font-variant-numeric:tabular-nums;font-size:12px;min-width:44px;border:2px solid var(--superficie)}
.calor th.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;height:120px;text-align:left;vertical-align:bottom}
.leyenda{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--tinta-3);margin-top:8px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.filtros{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--tinta-2);margin-bottom:10px}
.priv-banda{background:var(--priv-fondo);color:var(--priv);border:1px solid var(--priv);border-radius:6px;padding:10px 14px;font-size:13px;font-weight:600}
svg text{font-family:var(--font);fill:var(--tinta-2)}
.fila-actor{cursor:pointer}
.fila-actor:hover rect.fondo{fill:var(--superficie-2)}
.nota-actor{border-bottom:1px solid var(--linea);padding:10px 0;font-size:13px}
.nota-actor a{color:var(--tinta);font-weight:600}
.etq{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--linea-2);margin:4px 4px 0 0;color:var(--tinta-2)}
.etq.homonimo{border-color:var(--aviso);color:var(--aviso)}
.etq.probable{border-color:var(--acento);color:var(--acento)}
.etq.verificado{background:var(--acento);color:var(--superficie)}
.vacio{color:var(--tinta-3);font-size:14px;padding:12px 0}
footer{margin-top:28px;color:var(--tinta-3);font-size:12px;line-height:1.5;max-width:90ch}
@media (max-width:640px){.tema{grid-template-columns:1fr auto}.tema .pista{grid-column:1/-1;order:3}select{min-width:0;width:100%}}
</style></head>

<script>
const D=JSON.parse(document.getElementById('datos').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NT=Object.fromEntries(D.temas.map(t=>[t.id,t.nombre]));
const nomTema=k=>NT[k]||String(k).replace('sin_tema:','sin tema · ').replace('sin_leer','sin leer');
const NM=Object.fromEntries(D.municipios.map(m=>[m.cod,m.nombre]));
const CODM=Object.fromEntries(D.municipios.map(m=>[m.nombre,m.cod]));
const fmt=d=>{const [a,m,dd]=d.split('-');return `${+dd} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]}`};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function mezcla(t){ // escala secuencial entre --seq-0 y --seq-1
  const h=x=>x.match(/\w\w/g).map(v=>parseInt(v,16));const a=h(css('--seq-0').slice(1)),b=h(css('--seq-1').slice(1));
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function tinta(t){return t>.55?css('--superficie'):css('--tinta')}
const TEND={sube:['▲ sube','sube'],baja:['▼ baja','baja'],estable:['estable','otra'],semana_corta:['semana corta','otra'],poca_senal:['poca señal','otra'],sin_base:['sin base','otra']};
const tend=t=>{const [x,c]=TEND[t]||[t||'',''];return `<span class="tend ${c}">${esc(x)}</span>`};
const ESTADOS={en_calibracion:'en calibración',calibrada:'calibrada'};
const COB={en_curso:'semana en curso',reconstruida:'semana reconstruida',completa:'semana completa',incompleta:'semana incompleta'};

$('#sellos').innerHTML=`<span class="sello real">Datos reales · corte ${fmt(D.corte)}</span><span class="sello aviso">Lectura ${ESTADOS[D.estado_lectura]||D.estado_lectura}</span><span class="sello priv">Privado · no publicar</span>`;
$('#muni').innerHTML='<option value="">Los 10 municipios</option>'+D.municipios.map(m=>`<option value="${m.cod}">${esc(m.nombre)}${m.firmado?' · firmado':''}</option>`).join('');
$('#muni').value=CODM['Envigado']||'';
const PEST=[['abierto','Abierto','lo que vería cualquiera'],['susc','Suscripción','series y comparación'],['admin','Administrador','actores · privado'],['fuentes','Fuentes','qué escucha Pulso']];
let pest='abierto', actorSel=null;
$('#pestanas').innerHTML=PEST.map(([k,t,s])=>`<button role="tab" data-p="${k}" aria-selected="${k===pest}">${t}<span class="k">${s}</span></button>`).join('');
$('#pestanas').onclick=e=>{const b=e.target.closest('button');if(!b)return;pest=b.dataset.p;document.querySelectorAll('#pestanas button').forEach(x=>x.setAttribute('aria-selected',x===b));pintar()};
$('#muni').onchange=()=>{actorSel=null;pintar()};
$('#pie').innerHTML=`Pulso escucha medios y espacios públicos digitales: no es una encuesta, no mide opinión ni tono y no representa a la población. ${D.notas_leidas} de ${D.notas_total} notas leídas con el libro de códigos v3. Una nota cuenta para un municipio si lo nombra. Lo abierto no cuenta la red «Hoy» ni las notas electorales (retiradas) y enlaza solo con medio y fecha. Con menos de 10 notas con tema en 30 días se dice «poca señal». Las semanas anteriores al 22-oct son reconstruidas con lo que guardaban los feeds: no sirven para concluir tendencias. Los actores aparecen solo en el nivel de administrador. Generado con <code>make pulso-admin</code>.`;

/* ---------- ABIERTO ---------- */
function temasMuni(cod,vista){ // temas de la semana con conteo y tendencia
  const s=D.series[cod][vista];return D.temas.map(t=>({id:t.id,n:s[t.id].c.at(-1),tend:s[t.id].tend})).filter(x=>x.n||x.tend==='baja').sort((a,b)=>b.n-a.n)}
function abierto(){
  const cod=$('#muni').value;
  if(!cod){return `<section class="tarjeta"><h2>Los 10 municipios esta semana</h2><p class="nota">Semana ${esc(D.semana)}, hasta el ${fmt(D.corte)}. Pulse un municipio para ver su página.</p>
    <div class="mini">${D.municipios.map(m=>{const c=D.cabecera[m.cod].abierto,ts=temasMuni(m.cod,'abierto').slice(0,3);
    return `<div class="tarjeta" data-cod="${m.cod}"><p class="ante">${m.firmado?'Firmado':'Valle de Aburrá'}</p><h3>${esc(m.nombre)}</h3>
      <div class="chips"><span class="chip ${c.senal==='suficiente'?'ok':'poca'}">${c.senal==='suficiente'?'Con señal':'Poca señal'} · ${c.notas_30d}/30 días</span></div>
      ${ts.length?ts.map(t=>`<div class="nota">${esc(NT[t.id])} · ${t.n}</div>`).join(''):'<div class="nota">Sin notas con tema esta semana.</div>'}</div>`}).join('')}</div></section>`}
  const m=D.municipios.find(x=>x.cod===cod),c=D.cabecera[cod].abierto,ts=temasMuni(cod,'abierto'),max=Math.max(1,...ts.map(t=>t.n));
  const enl=Object.fromEntries((D.abierto[cod]||[]).map(t=>[t.id,t.enlaces]));
  const t30=Object.entries(D.treinta[cod]?.abierto||{}).sort((a,b)=>b[1]-a[1]);
  const max30=Math.max(1,...t30.map(x=>x[1]));
  return `<section class="tarjeta"><p class="ante">${m.firmado?'Municipio firmado':'Valle de Aburrá'} · ${esc(D.semana)}</p><h2>Qué se conversa en ${esc(m.nombre)}</h2>
  <div class="chips"><span class="chip ${c.senal==='suficiente'?'ok':'poca'}">${c.senal==='suficiente'?`Con señal: ${c.notas_30d} notas con tema en 30 días`:`Poca señal: ${c.notas_30d} de 10 notas en 30 días. No se calculan alzas ni bajas`}</span>
  <span class="chip">${esc(COB[c.cobertura]||c.cobertura)}</span><span class="chip">${c.notas_con_tema} notas con tema esta semana</span>${+c.retiradas_electoral?`<span class="chip">${c.retiradas_electoral} electorales retiradas</span>`:''}</div>
  ${ts.length?ts.map(t=>`<div class="tema"><div>${esc(NT[t.id])}</div><div class="pista"><div class="barra" style="width:${100*t.n/max}%"></div></div><div>${tend(t.tend)} <span class="num">${t.n}</span></div>
    ${(enl[t.id]||[]).length?`<div class="enlaces">${enl[t.id].map(e=>`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.medio)} · ${fmt(e.fecha)}</a>`).join('')}</div>`:''}</div>`).join('')
   :'<p class="vacio">Esta semana no hay notas con tema sobre este municipio en las fuentes que escucha Pulso.</p>'}
  </section>
  <section class="tarjeta"><h3>Los últimos 30 días</h3><p class="nota">Notas con tema por tema, sin la red «Hoy» y sin las electorales.</p>
  ${t30.length?t30.map(([k,v])=>`<div class="tema"><div>${esc(NT[k])}</div><div class="pista"><div class="barra" style="width:${100*v/max30}%;opacity:.55"></div></div><div class="num">${v}</div></div>`).join(''):'<p class="vacio">Sin notas con tema en 30 días.</p>'}</section>
  <section class="tarjeta"><h3>¿Cómo se calcula?</h3><p class="nota" style="max-width:75ch">Pulso lee las notas de los medios que nombran a ${esc(m.nombre)} y les asigna un tema de necesidad con un libro de códigos público. Cuenta notas, no personas: no es una encuesta ni mide opinión. «Sube» o «baja» compara la parte de cada tema esta semana con las cuatro anteriores, y solo se dice cuando hay al menos 10 notas con tema en 30 días. Cada nota se enlaza con su medio y su fecha.</p></section>`}

/* ---------- SUSCRIPCIÓN ---------- */
let vistaSerie='privado';
function suscripcion(){
  const cod=$('#muni').value;
  const semanas=D.semanas.map((s,i)=>`<th class="c" title="${esc(COB[D.coberturas[i]])}">${fmt(s)}${D.coberturas[i]==='reconstruida'?'<br><span class="nota">rec.</span>':D.coberturas[i]==='en_curso'?'<br><span class="nota">en curso</span>':''}</th>`).join('');
  let calor='';
  if(cod){const s=D.series[cod][vistaSerie];const max=Math.max(1,...D.temas.flatMap(t=>s[t.id].c));
    const filas=D.temas.map(t=>({t,c:s[t.id].c,tot:s[t.id].c.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.tot-a.tot);
    calor=`<div class="desplaza"><table class="calor"><tr><th>Tema</th>${semanas}<th>Tendencia</th></tr>${filas.map(f=>`<tr><td>${esc(f.t.nombre)}</td>${f.c.map(v=>`<td class="c" style="background:${v?mezcla(v/max):css('--sin-dato')};color:${tinta(v/max)}">${v||''}</td>`).join('')}<td>${tend(s[f.t.id].tend)}</td></tr>`).join('')}</table></div>`}
  // matriz municipios × temas, 30 días, proporción
  const filasM=D.municipios.map(m=>{const x=D.treinta[m.cod]?.[vistaSerie]||{},tot=Object.values(x).reduce((a,b)=>a+b,0);return {m,x,tot}});
  const matriz=`<div class="desplaza"><table class="calor"><tr><th>Municipio</th><th class="n">Notas</th>${D.temas.map(t=>`<th class="rot">${esc(t.nombre)}</th>`).join('')}</tr>
    ${filasM.map(f=>`<tr><td>${esc(f.m.nombre)}${f.m.firmado?' <span class="nota">firmado</span>':''}</td><td class="n">${f.tot}</td>${D.temas.map(t=>{const v=f.x[t.id]||0,p=f.tot?v/f.tot:0;return `<td class="c" title="${v} notas" style="background:${v?mezcla(Math.min(1,p*2.5)):css('--sin-dato')};color:${tinta(Math.min(1,p*2.5))}">${v?Math.round(100*p)+'%':''}</td>`}).join('')}</tr>`).join('')}</table></div>`;
  // señal por municipio
  const maxs=Math.max(12,...D.municipios.map(m=>+D.cabecera[m.cod][vistaSerie].notas_30d));
  const W=640,fila=26,H=D.municipios.length*fila+28,x0=170,ancho=W-x0-50,u=v=>x0+ancho*v/maxs;
  const senal=`<div class="desplaza"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Notas con tema en 30 días por municipio">
    ${D.municipios.map((m,i)=>{const v=+D.cabecera[m.cod][vistaSerie].notas_30d,y=i*fila+8;return `<text x="${x0-8}" y="${y+14}" text-anchor="end" font-size="12">${esc(m.nombre)}</text><rect x="${x0}" y="${y+3}" width="${Math.max(1,u(v)-x0)}" height="14" rx="2" fill="${v>=10?css('--acento'):css('--aviso')}"/><text x="${u(v)+6}" y="${y+14}" font-size="12">${v}</text>`}).join('')}
    <line x1="${u(10)}" x2="${u(10)}" y1="2" y2="${H-18}" stroke="${css('--tinta')}" stroke-dasharray="3 3"/><text x="${u(10)+4}" y="${H-4}" font-size="11">umbral B-024: 10 notas</text></svg></div>`;
  return `<div class="filtros"><label><input type="radio" name="vs" value="privado" ${vistaSerie==='privado'?'checked':''}> Privado (con la red «Hoy»)</label><label><input type="radio" name="vs" value="abierto" ${vistaSerie==='abierto'?'checked':''}> Abierto</label></div>
  ${cod?`<section class="tarjeta"><h2>${esc(NM[cod])}: ocho semanas por tema</h2><p class="nota">Notas por semana. «rec.»: semana reconstruida con lo que guardaban los feeds el 22-oct, no comparable todavía.</p>${calor}</section>`:''}
  <section class="tarjeta"><h2>Comparación entre municipios</h2><p class="nota">Parte de cada tema en las notas con tema de los últimos 30 días. Las celdas vacías son temas sin notas.</p>${matriz}</section>
  <section class="tarjeta"><h2>Señal por municipio</h2><p class="nota">Notas con tema en 30 días. Debajo de la línea, Pulso no calcula alzas ni bajas.</p>${senal}</section>`}

/* ---------- ADMINISTRADOR ---------- */
let ocultar=true,soloVer=false;
const JC={probable:'--acento',sin_juicio:'--linea-2',homonimo:'--aviso',no_es_persona:'--aviso'};
function notasVisibles(a){const cod=$('#muni').value;return a.notas.filter(n=>(!cod||NM[cod]===n.municipio)&&(!soloVer||n.estado==='verificado')&&(!ocultar||(n.juicio_claude!=='homonimo'&&n.juicio_claude!=='no_es_persona'&&n.estado!=='descartado')))}
function admin(){
  const lista=D.actores.map(a=>({a,ns:notasVisibles(a)})).filter(x=>x.ns.length).sort((x,y)=>y.ns.length-x.ns.length||x.a.nombre.localeCompare(y.a.nombre));
  const filtros=`<div class="filtros"><label><input type="checkbox" id="oc" ${ocultar?'checked':''}> Ocultar homónimos y descartadas</label><label><input type="checkbox" id="sv" ${soloVer?'checked':''}> Solo verificadas</label></div>`;
  const banda=`<div class="priv-banda">Privado · no publicar. Menciones encontradas por el buscador en el titular y el resumen; el juicio es de Claude y la verificación es humana (data/pulso/privado/menciones.csv).</div>`;
  if(!lista.length)return banda+filtros+'<p class="vacio">Sin menciones con este filtro.</p>';
  if(!actorSel||!lista.some(x=>x.a.id===actorSel))actorSel=lista[0].a.id;
  const nom=n=>n.length>30?n.slice(0,29)+'…':n;
  const titulo=a=>a.nombre.replace(/\b(\p{L})(\p{L}*)/gu,(m,p,r)=>p+r.toLowerCase());
  // ranking apilado por juicio
  const top=lista.slice(0,20),fila=24,W=620,x0=210,maxv=Math.max(...top.map(x=>x.ns.length)),u=v=>(W-x0-56)*v/maxv;
  const ranking=`<svg viewBox="0 0 ${W} ${top.length*fila+10}" width="100%" style="min-width:480px;max-width:760px" role="img" aria-label="Actores por número de menciones">${top.map((x,i)=>{
    const c={};x.ns.forEach(n=>{const k=n.juicio_claude||'sin_juicio';c[k]=(c[k]||0)+1});let xx=x0,y=i*fila+4;
    const seg=['probable','sin_juicio','homonimo','no_es_persona'].filter(k=>c[k]).map(k=>{const w=u(c[k]),r=`<rect x="${xx}" y="${y+4}" width="${w}" height="14" fill="${css(JC[k])}"><title>${c[k]} ${k.replace('_',' ')}</title></rect>`;xx+=w;return r}).join('');
    return `<g class="fila-actor" data-a="${esc(x.a.id)}"><rect class="fondo" x="0" y="${y}" width="${W}" height="${fila-2}" fill="${x.a.id===actorSel?css('--superficie-2'):'transparent'}"/><text x="${x0-8}" y="${y+16}" text-anchor="end" font-size="12" ${x.a.id===actorSel?'font-weight="700"':''}>${esc(nom(titulo(x.a)))}</text>${seg}<text x="${xx+6}" y="${y+16}" font-size="12">${x.ns.length}</text></g>`}).join('')}</svg>`;
  // red actor–municipio
  const red=(()=>{const acts=lista.slice(0,14),munis=[...new Set(acts.flatMap(x=>x.ns.map(n=>n.municipio)))].sort();
    const H=Math.max(acts.length,munis.length)*30+20,W=640,xa=200,xm=W-200,ya=i=>20+i*(H-30)/Math.max(1,acts.length-1||1),ym=i=>20+i*(H-30)/Math.max(1,munis.length-1||1);
    let enl='';acts.forEach((x,i)=>{const c={};x.ns.forEach(n=>c[n.municipio]=(c[n.municipio]||0)+1);Object.entries(c).forEach(([mu,v])=>{const j=munis.indexOf(mu),y1=ya(i),y2=ym(j),sel=x.a.id===actorSel;
      enl+=`<path d="M${xa},${y1} C${(xa+xm)/2},${y1} ${(xa+xm)/2},${y2} ${xm},${y2}" fill="none" stroke="${sel?css('--sube'):css('--acento')}" stroke-opacity="${sel?.9:.28}" stroke-width="${1+2.2*v}"><title>${esc(x.a.nombre)} · ${esc(mu)}: ${v}</title></path>`})});
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;max-width:820px" role="img" aria-label="Red de actores y municipios">${enl}
    ${acts.map((x,i)=>`<g class="fila-actor" data-a="${esc(x.a.id)}"><circle cx="${xa}" cy="${ya(i)}" r="4" fill="${css('--tinta')}"/><text x="${xa-8}" y="${ya(i)+4}" text-anchor="end" font-size="11" ${x.a.id===actorSel?'font-weight="700"':''}>${esc(nom(titulo(x.a)))}</text></g>`).join('')}
    ${munis.map((m,j)=>`<circle cx="${xm}" cy="${ym(j)}" r="5" fill="${css('--acento')}"/><text x="${xm+10}" y="${ym(j)+4}" font-size="12" font-weight="600">${esc(m)}</text>`).join('')}</svg>`})();
  // actor × tema
  const temasUsados=[...new Set(lista.flatMap(x=>x.ns.map(n=>n.tema)))].sort((a,b)=>nomTema(a).localeCompare(nomTema(b)));
  const maxc=Math.max(1,...lista.flatMap(x=>temasUsados.map(t=>x.ns.filter(n=>n.tema===t).length)));
  const matriz=`<div class="desplaza"><table class="calor"><tr><th>Actor</th>${temasUsados.map(t=>`<th class="rot">${esc(nomTema(t))}</th>`).join('')}</tr>${lista.slice(0,20).map(x=>`<tr class="fila-actor" data-a="${esc(x.a.id)}"><td ${x.a.id===actorSel?'style="font-weight:700"':''}>${esc(nom(titulo(x.a)))}</td>${temasUsados.map(t=>{const v=x.ns.filter(n=>n.tema===t).length;return `<td class="c" style="background:${v?mezcla(v/maxc):css('--sin-dato')};color:${tinta(v/maxc)}">${v||''}</td>`}).join('')}</tr>`).join('')}</table></div>`;
  // línea de tiempo
  const tl=(()=>{const acts=lista.slice(0,14),fechas=acts.flatMap(x=>x.ns.map(n=>n.fecha)).sort();
    const t0=new Date(fechas[0]),t1=new Date(D.corte),W=680,x0=200,fila=22,H=acts.length*fila+34,X=d=>x0+(W-x0-14)*((new Date(d)-t0)/Math.max(1,t1-t0));
    const anios=[];for(let y=t0.getFullYear();y<=t1.getFullYear();y++)anios.push(y);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="Menciones en el tiempo">
      ${anios.map(y=>{const x=X(`${y}-01-01`);return x>=x0?`<line x1="${x}" x2="${x}" y1="0" y2="${H-20}" stroke="${css('--linea')}"/><text x="${x+3}" y="${H-6}" font-size="11">${y}</text>`:''}).join('')}
      ${acts.map((x,i)=>{const y=i*fila+12;return `<g class="fila-actor" data-a="${esc(x.a.id)}"><text x="${x0-8}" y="${y+4}" text-anchor="end" font-size="11" ${x.a.id===actorSel?'font-weight="700"':''}>${esc(nom(titulo(x.a)))}</text><line x1="${x0}" x2="${W-14}" y1="${y}" y2="${y}" stroke="${css('--linea')}" stroke-dasharray="2 3"/>${x.ns.map(n=>`<circle cx="${X(n.fecha)}" cy="${y}" r="4.5" fill="${css(JC[n.juicio_claude||'sin_juicio'])}" fill-opacity=".8"><title>${esc(n.fecha)} · ${esc(n.medio)} · ${esc(n.titulo)}</title></circle>`).join('')}</g>`}).join('')}</svg>`})();
  // detalle
  const sel=lista.find(x=>x.a.id===actorSel);
  const detalle=`<h3>${esc(titulo(sel.a))}</h3><p class="nota">${sel.ns.length} menciones · registro: ${esc(sel.a.origenes.join(', '))}</p>${sel.ns.map(n=>`<div class="nota-actor"><span class="nota">${fmt(n.fecha)} ${n.fecha.slice(0,4)} · ${esc(n.medio)} · ${esc(n.municipio)} · ${esc(nomTema(n.tema))}</span><br><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.titulo)}</a><br>
    <span class="etq">${esc(n.origen)}: «${esc(n.evidencia)}»</span>${n.ambigua==='si'?'<span class="etq homonimo">evidencia ambigua</span>':''}<span class="etq ${esc(n.juicio_claude)}">Claude: ${esc((n.juicio_claude||'sin juicio').replace('_',' '))}</span><span class="etq ${esc(n.estado)}">${esc(n.estado.replace('_',' '))}</span>${n.tipo_evento?`<span class="etq">${esc(n.tipo_evento)}</span>`:''}${n.valencia?`<span class="etq">${esc(n.valencia)}</span>`:''}</div>`).join('')}`;
  const ley=`<div class="leyenda"><span><i style="background:${css('--acento')}"></i>probable</span><span><i style="background:${css('--linea-2')}"></i>sin juicio</span><span><i style="background:${css('--aviso')}"></i>homónimo</span></div>`;
  const total=lista.reduce((a,x)=>a+x.ns.length,0);
  return `${banda}${filtros}
  <div class="chips"><span class="chip">${lista.length} actores</span><span class="chip">${total} menciones</span><span class="chip">${$('#muni').value?esc(NM[$('#muni').value]):'10 municipios'}</span></div>
  <section class="tarjeta"><h2>Quién aparece</h2><p class="nota">Menciones por actor, según el juicio de Claude. Pulse un actor para ver sus notas.</p><div class="desplaza">${ranking}</div>${ley}</section>
  <section class="tarjeta"><h2>Dónde aparece</h2><p class="nota">Cada línea une un actor con un municipio; su grosor es el número de menciones.</p><div class="desplaza">${red}</div></section>
  <section class="tarjeta"><h2>De qué tema se habla cuando aparece</h2><p class="nota">Menciones por tema de la nota (libro v3).</p>${matriz}</section>
  <section class="tarjeta"><h2>Cuándo aparece</h2><p class="nota">Cada punto es una nota. Las de antes de octubre de 2026 vienen de lo que guardaban los feeds: la historia todavía es desigual.</p><div class="desplaza">${tl}</div>${ley}</section>
  <section class="tarjeta">${detalle}</section>`}

/* ---------- FUENTES ---------- */
function fuentes(){
  const cod=$('#muni').value,munis=cod?[cod]:D.municipios.map(m=>m.cod);
  const CL={medio_local:'medio local',seccion_regional:'sección regional',canal_youtube:'YouTube'};
  const maxd=730;
  const bloques=munis.map(c=>{const fs=D.fuentes.filter(f=>f.cod===c).sort((a,b)=>(a.estado!=='activa')-(b.estado!=='activa')||b.notas-a.notas);
    return `<section class="tarjeta"><h3>${esc(NM[c])}${D.municipios.find(m=>m.cod===c).firmado?' <span class="nota">· firmado</span>':''}</h3><p class="nota">${fs.filter(f=>f.estado==='activa').length} fuentes activas, ${fs.filter(f=>f.estado==='activa'&&f.clase==='medio_local').length} de ellas medios locales.</p>
    <div class="desplaza"><table><tr><th>Medio</th><th>Tipo</th><th>Estado</th><th class="n">Notas</th><th class="n">Nombran</th><th>Lo que cubre el feed</th></tr>${fs.map(f=>`<tr><td>${esc(f.medio)}${f.hoy?' <span class="etq homonimo">red «Hoy»</span>':''}</td><td>${esc(CL[f.clase]||f.clase)}</td><td>${esc(f.estado)}</td><td class="n">${f.notas||''}</td><td class="n">${f.notas?Math.round(100*f.nombran/f.notas)+'%':''}</td>
      <td style="min-width:180px">${f.dias!=null?`<svg width="140" height="10"><rect width="140" height="10" fill="${css('--superficie-2')}"/><rect width="${Math.max(2,140*Math.min(f.dias,maxd)/maxd)}" height="10" fill="${f.dias<10?css('--sube'):css('--acento')}"/></svg> <span class="num nota">${f.dias} días</span>`:''}</td></tr>`).join('')}</table></div></section>`}).join('');
  return `<section class="tarjeta"><h2>Qué escucha Pulso</h2><p class="nota" style="max-width:80ch">Cada feed muestra entre 10 y 20 notas. «Lo que cubre el feed» es cuántos días hay entre su nota más vieja y la más nueva: en rojo, menos de 10 días, donde un día sin colecta se pierde. La auditoría del 22-oct propone empalmar la colecta (pedir páginas anteriores hasta encontrar una nota ya guardada) y reconstruir la historia con la misma regla para todos.</p></section>${bloques}`}

function pintar(){
  const v=$('#vista');
  v.className='panel';
  v.innerHTML=pest==='abierto'?abierto():pest==='susc'?suscripcion():pest==='admin'?admin():fuentes();
  v.querySelectorAll('[data-cod]').forEach(el=>el.onclick=()=>{$('#muni').value=el.dataset.cod;pintar()});
  v.querySelectorAll('input[name="vs"]').forEach(el=>el.onchange=()=>{vistaSerie=el.value;pintar()});
  const oc=v.querySelector('#oc'),sv=v.querySelector('#sv');
  if(oc)oc.onchange=()=>{ocultar=oc.checked;pintar()};if(sv)sv.onchange=()=>{soloVer=sv.checked;pintar()};
  v.querySelectorAll('.fila-actor').forEach(el=>el.onclick=()=>{actorSel=el.dataset.a;pintar()});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',pintar);
pintar();
</script><a href="../../como-lo-hacemos/index.html#pulso" target="_top" id="volver-civislab" style="position:fixed;left:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:44px;border-radius:999px;background:#2B4B48;color:#fff;font:600 15px/1 'Montserrat',system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25)">← Volver a CivisLab</a>
