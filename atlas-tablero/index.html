<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análisis Territorial · Medellín · prototipo</title>
<meta name="description" content="Prototipo interno del Análisis Territorial Multidimensional Integrado de CivisLab: siete dimensiones de Medellín por comuna, con lo que cada dato permite decir y lo que no.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>/* Tablero del Análisis Territorial, prototipo (segunda versión). Tokens de la marca CivisLab
   (landing/src/estilos.css): Montserrat; verde, salvia y papel. Una sola imagen manda: la cuadrícula o el
   mapa. La escala es la misma en los dos temas, para que «más oscuro es más alto» (I2) valga siempre. */
:root{
  --papel:#F4F5F2; --superficie:#FFFFFF; --superficie-2:#EEF1EC; --superficie-3:#E5EAE3;
  --linea:#D8DED6; --linea-2:#BFC9BE;
  --tinta:#1D2422; --tinta-2:#4C5752; --tinta-3:#65706B;
  --verde:#2B4B48; --verde-2:#3B625D; --salvia:#96B483; --oro:#B08A2E;
  --acento:#2B4B48; --acento-tinta:#FFFFFF; --acento-suave:#E2EBE0;
  --sim:#7E5F14; --sim-fondo:#F6EDD6; --sim-borde:#D9C189;
  --foco:#2B4B48; --rio:#BFD3DA;
  --sin-dato:#E3E6E2; --sin-dato-raya:#B9C0B8; --mapa-gris:#ECEFEB; --mapa-borde:#FFFFFF;
  --t0:#E6EEE2; --t1:#C8DBBF; --t2:#A3C291; --t3:#6B9470; --t4:#436C5F; --t5:#2B4B48;
  /* semáforo (Carlos, 29-oct): fuera de la paleta de marca, solo para el color de los datos. Luminosidad distinta
     en los tres (L* 58, 73 y 40) para que se separen también con daltonismo; los mismos en los dos temas. */
  --s-mejor:#2F9E5E; --s-parecido:#F2A33A; --s-peor:#B3261E;
  --f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-s:8px;
  --curva:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0F1716; --superficie:#16201E; --superficie-2:#1C2826; --superficie-3:#22302D;
    --linea:#2A3935; --linea-2:#3A4C47;
    --tinta:#E8EEEA; --tinta-2:#B5C2BC; --tinta-3:#93A29B;
    --acento:#A9C98F; --acento-tinta:#10201D; --acento-suave:#22332B;
    --sim:#E4BC6A; --sim-fondo:#2C2415; --sim-borde:#6B5627;
    --foco:#A9C98F; --rio:#2C4650;
    --sin-dato:#26302D; --sin-dato-raya:#44514D; --mapa-gris:#22302D; --mapa-borde:#16201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#0F1716; --superficie:#16201E; --superficie-2:#1C2826; --superficie-3:#22302D;
  --linea:#2A3935; --linea-2:#3A4C47;
  --tinta:#E8EEEA; --tinta-2:#B5C2BC; --tinta-3:#93A29B;
  --acento:#A9C98F; --acento-tinta:#10201D; --acento-suave:#22332B;
  --sim:#E4BC6A; --sim-fondo:#2C2415; --sim-borde:#6B5627;
  --foco:#A9C98F; --rio:#2C4650;
  --sin-dato:#26302D; --sin-dato-raya:#44514D; --mapa-gris:#22302D; --mapa-borde:#16201E;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- cabecera ---------- */
.cabecera,.tablero,.pie{max-width:1440px;margin-inline:auto}
.cabecera{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:12px}
.marca{font-weight:900;font-size:21px;letter-spacing:.02em;display:inline-flex;align-items:center;color:var(--tinta);text-decoration:none}
.marca .barra{display:inline-block;width:4px;height:17px;background:var(--salvia);margin:0 2px;transform:translateY(1px)}
.marca .lab{color:var(--acento);margin-left:6px}
.cabecera-titulo{display:grid;gap:1px;min-width:0;margin-right:auto}
.antetitulo{font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.cabecera h1{font-weight:700;font-size:18px;line-height:1.2}
.vistas{display:inline-flex;border:1px solid var(--linea-2);border-radius:999px;padding:3px;background:var(--superficie)}
.vistas button{border:0;background:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:var(--tinta-2);cursor:pointer;min-height:34px;transition:background-color .25s,color .25s}
.vistas button[aria-pressed="true"]{background:var(--acento);color:var(--acento-tinta)}
.sello{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sim);background:var(--sim-fondo);border:1px solid var(--sim-borde);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sello svg{width:12px;height:12px;flex:none}

/* ---------- distribución ---------- */
.tablero{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"dims dims" "escena lectura";gap:16px 20px;padding-bottom:24px}
.dimensiones{grid-area:dims}
.escena{grid-area:escena;min-width:0}
.lectura{grid-area:lectura;min-width:0}

/* ---------- dimensiones: botones grandes ---------- */
.dimensiones{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.dim{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:92px;padding:14px;border-radius:var(--r);border:1px solid var(--linea);background:var(--superficie);cursor:pointer;text-align:left;font-weight:700;font-size:15px;line-height:1.2;transition:background-color .35s var(--curva),color .35s,transform .2s var(--curva),box-shadow .2s}
.dim:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(29,36,34,.10)}
.dim svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--verde-2);transition:color .35s}
.dim[aria-pressed="true"]{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}
.dim[aria-pressed="true"] svg{color:var(--salvia)}

/* ---------- escena ---------- */
.escena{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:10px}
.escena-barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:36px}
.subindicadores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sub{border:1px solid var(--linea-2);background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--tinta-2);cursor:pointer;min-height:34px;transition:background-color .25s,color .25s,border-color .25s}
.sub[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento);color:var(--tinta)}
.sub-titulo{font-size:16px;font-weight:800}
.interruptor{border:1px solid var(--linea-2);background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--tinta-2);cursor:pointer;min-height:34px}
.interruptor[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

.escenario{position:relative;height:clamp(420px,62vh,640px);border-radius:var(--r-s);overflow:hidden}
.rapido .tesela,.rapido path{--retraso:0ms!important;transition-duration:.45s}
.capa{position:absolute;inset:0;width:auto;height:100%;opacity:0;pointer-events:none;transition:opacity .5s var(--curva),transform .6s var(--curva),right .5s var(--curva);transform:scale(.985)}
.con-ficha .capa{right:384px}
.capa.activa{opacity:1;pointer-events:auto;transform:none}

/* cuadrícula de fichas iguales */
.capa-cuadricula{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;padding:4px}
.rio{position:absolute;top:0;bottom:0;left:calc(50% - 6px);width:12px;height:100%;pointer-events:none}
.rio path{fill:none;stroke:var(--rio);stroke-width:6;stroke-linecap:round}
.rio-nombre{position:absolute;left:calc(50% + 10px);bottom:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);pointer-events:none}
.tesela{position:relative;z-index:1;border:0;border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;background:var(--sin-dato);color:var(--tinta);
  transition:background-color .7s var(--curva) var(--retraso,0ms),color .7s var(--curva) var(--retraso,0ms),transform .3s var(--curva),opacity .35s,box-shadow .3s;overflow:hidden;min-width:0}
.tesela .nombre{font-size:12.5px;font-weight:700;line-height:1.15}
.tesela .nombre .corto{display:none}
.tesela .cifra{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s var(--curva)}
.tesela .cifra small{font-size:12px;font-weight:600;margin-left:4px;opacity:.85}
.tesela.corr{outline:1.5px dashed var(--linea-2);outline-offset:-5px}
.tesela:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 22px rgba(29,36,34,.18);z-index:2}
.tesela:hover .cifra,.con-cifras .tesela .cifra,.tesela.elegida .cifra{opacity:1;transform:none}
.n0{background:var(--t0);color:#1D2422}.n1{background:var(--t1);color:#1D2422}.n2{background:var(--t2);color:#1D2422}
.n3{background:var(--t3);color:#fff}.n4{background:var(--t4);color:#fff}.n5{background:var(--t5);color:#fff}
.s-mejor{background:var(--s-mejor);color:#10201A}.s-parecido{background:var(--s-parecido);color:#2A1B05}.s-peor{background:var(--s-peor);color:#fff}
.pie-tesela{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-width:0}
.signo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.signo b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.88);color:#1D2422;font-size:12px;line-height:1}
.signo:empty{display:none}
.tesela.rayada{background:repeating-linear-gradient(45deg,var(--sin-dato) 0 6px,var(--sin-dato-raya) 6px 9px);color:var(--tinta)}
.tesela.sin{background:var(--sin-dato);color:var(--tinta-3)}
.enfoque .tesela:not(.elegida):not(.resaltada){opacity:.35}
.tesela.elegida{transform:scale(1.06);box-shadow:0 0 0 3px var(--papel),0 0 0 6px var(--tinta);z-index:3}
.tesela.resaltada{animation:latido 1.1s var(--curva) infinite;z-index:3}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(176,138,46,0),0 0 0 3px var(--oro)}50%{box-shadow:0 0 0 10px rgba(176,138,46,.25),0 0 0 3px var(--oro)}}

/* mapa del DANE: la vista principal. Los bordes y los rótulos guardan su tamaño en pantalla al acercar. */
.capa-mapa{cursor:grab;touch-action:none;background:var(--superficie-2);border-radius:var(--r-s)}
.capa-mapa:active{cursor:grabbing}
.capa-mapa path{fill:var(--sin-dato);stroke:var(--mapa-borde);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .7s var(--curva) var(--retraso,0ms),opacity .35s,stroke .3s}
.capa-mapa path.n0{fill:var(--t0)}.capa-mapa path.n1{fill:var(--t1)}.capa-mapa path.n2{fill:var(--t2)}
.capa-mapa path.n3{fill:var(--t3)}.capa-mapa path.n4{fill:var(--t4)}.capa-mapa path.n5{fill:var(--t5)}
.capa-mapa path.rayada{fill:url(#rayado)}
.capa-mapa path.s-mejor{fill:var(--s-mejor)}.capa-mapa path.s-parecido{fill:var(--s-parecido)}.capa-mapa path.s-peor{fill:var(--s-peor)}
.capa-mapa path.gris{fill:var(--mapa-gris);stroke:var(--linea-2)}
.capa-mapa path:hover{stroke:var(--tinta);stroke-width:2.5}
.enfoque .capa-mapa path:not(.elegida):not(.resaltada){opacity:.45}
.capa-mapa path.elegida{stroke:var(--tinta);stroke-width:3.5}
.capa-mapa path.resaltada{stroke:var(--oro);stroke-width:4;animation:latido-mapa 1.1s infinite}
@keyframes latido-mapa{50%{stroke-width:9}}
.rotulos text{font-family:var(--f);font-weight:700;fill:var(--tinta);paint-order:stroke;stroke:var(--superficie);stroke-linejoin:round;pointer-events:none}
.rotulos .nom{font-weight:700;letter-spacing:.01em}
.rotulos text.corr .nom{font-style:italic;font-weight:600;fill:var(--tinta-2)}
.lejos .rotulos text:not(.corr) .nom{display:none}
.rotulos .signo-mapa{font-size:1.3em;font-weight:900}
.rotulos .cifra-mapa{opacity:0;transition:opacity .3s}
.con-cifras .rotulos .cifra-mapa{opacity:1}

/* estaciones (R11, I7): comunas en gris claro y puntos aparte, en el mismo mapa */
.punto circle{stroke:var(--tinta);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s var(--curva) var(--retraso,0ms)}
.crece .punto circle{transform:scale(1)}
.punto circle.s-mejor{fill:var(--s-mejor)}.punto circle.s-parecido{fill:var(--s-parecido)}.punto circle.s-peor{fill:var(--s-peor)}
.punto circle.fuera{fill:none;stroke:var(--tinta-3);stroke-dasharray:4 3}
.punto text{font-family:var(--f);font-weight:800;pointer-events:none}
.punto .signo-punto{font-size:1px;fill:#1D2422;opacity:0;transition:opacity .3s .5s}
.crece .punto .signo-punto{opacity:1}
.punto .cifra-punto{font-size:.95px;fill:var(--tinta);paint-order:stroke;stroke:var(--superficie);stroke-width:.25px;opacity:0;transition:opacity .3s}
.con-cifras .punto .cifra-punto{opacity:1}

/* controles del mapa: + y −, como en el boceto de Estratega */
.zoom{position:absolute;top:10px;right:10px;justify-content:flex-end;z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.zoom button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--linea-2);background:var(--superficie);color:var(--tinta);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(29,36,34,.10)}
.zoom button.texto{font-size:12px;padding:0 12px}
.zoom button:hover{border-color:var(--acento)}

/* ficha de la comuna: se levanta desde abajo */
.ficha{position:absolute;right:6px;bottom:6px;width:min(360px,calc(100% - 28px));z-index:5;background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);box-shadow:0 18px 40px rgba(29,36,34,.22);padding:16px 18px;display:grid;gap:8px;animation:levanta .45s var(--curva)}
@keyframes levanta{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.ficha-cabeza{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ficha h3{font-size:20px;font-weight:800;line-height:1.15}
.ficha .tipo{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.ficha .cerrar{border:0;background:var(--superficie-2);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.ficha-estado{display:inline-flex;align-items:center;gap:8px;justify-self:start;padding:4px 12px 4px 4px;border-radius:999px;font-size:13px;font-weight:800}
.ficha-estado b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.88);color:#1D2422}
.ficha .ficha-frase{font-size:15px;line-height:1.45}
.ficha .curva{width:100%;height:auto;display:block}
.ficha .curva path{fill:none;stroke:var(--verde-2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ficha .curva path.area{fill:var(--acento-suave);stroke:none}
.ficha .curva circle{fill:var(--verde-2)}
.ficha .curva circle.ahora{fill:var(--oro)}
.ficha .curva text{font-family:var(--f);font-size:11px;fill:var(--tinta-3);font-variant-numeric:tabular-nums}
.ficha details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--acento)}
.ficha ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:13px;max-height:200px;overflow:auto}
.ficha li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linea);padding:3px 0}
.ficha li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ficha li span{color:var(--tinta-2)}

/* leyenda */
.leyenda{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--tinta-2);min-height:20px}
.rampa{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.rampa i{display:inline-block;width:22px;height:12px}
.rampa i:first-of-type{border-radius:3px 0 0 3px}.rampa i:last-of-type{border-radius:0 3px 3px 0}
.muestra{display:inline-flex;align-items:center;gap:6px}
.muestra i{width:14px;height:14px;border-radius:3px;display:inline-block}
.muestra .gris{background:var(--sin-dato)}
.muestra .raya{background:repeating-linear-gradient(45deg,var(--sin-dato) 0 3px,var(--sin-dato-raya) 3px 5px)}
.muestra i[class^="s-"]{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:#fff}
.muestra i.s-mejor,.muestra i.s-parecido{color:#1D2422}
.muestra .punto{border-radius:50%;border:1.5px dashed var(--tinta-3)}
.leyenda b{color:var(--tinta)}

/* línea de tiempo */
.tiempo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-s);background:var(--superficie-2)}
.tiempo:empty{display:none}
.reproducir{width:46px;height:46px;border-radius:50%;border:0;background:var(--acento);color:var(--acento-tinta);cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--curva)}
.reproducir:hover{transform:scale(1.06)}
.reproducir svg{width:18px;height:18px;fill:currentColor}
.regla-tiempo{display:grid;gap:4px}
.regla-tiempo input{width:100%;accent-color:var(--acento);margin:0}
.marcas{display:flex;justify-content:space-between;font-size:11px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.anio-grande{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;min-width:3.2ch;text-align:right;letter-spacing:-.01em}

/* ---------- lectura ---------- */
.lectura{display:flex;flex-direction:column;gap:16px;background:var(--superficie);border:1px solid var(--linea);border-top:4px solid var(--oro);border-radius:var(--r);padding:20px 22px}
.lectura-de{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.frase{font-size:clamp(21px,1.75vw,26px);font-weight:700;line-height:1.3;letter-spacing:-.005em}
.frase .fuente{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--tinta-3);letter-spacing:0}
.cambia{animation:entra .45s var(--curva)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.no{display:grid;gap:6px}
.no p{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--tinta-2);line-height:1.4}
.no p::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--oro);transform:translateY(1px)}
.regla{flex:none;margin-left:auto;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--sim-fondo);color:var(--sim);cursor:help}
.ciudad{font-size:13px;color:var(--tinta-2);padding-top:12px;border-top:1px solid var(--linea)}
.ciudad b{font-size:20px;font-weight:800;color:var(--tinta);font-variant-numeric:tabular-nums;margin-right:4px}
.detalle summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--acento)}
.detalle div{display:grid;gap:8px;margin-top:10px;font-size:13px;color:var(--tinta-2)}
.detalle h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);margin-top:4px}
.detalle ul{margin:0;padding-left:18px;display:grid;gap:4px}
.recorridos{margin-top:auto;display:grid;gap:8px}
.recorridos h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.recorrido{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--linea-2);background:var(--superficie);cursor:pointer;text-align:left;font-weight:700;font-size:14px}
.recorrido:hover{border-color:var(--acento)}
.recorrido .play{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acento-suave);display:grid;place-items:center;color:var(--acento)}
.recorrido .play svg{width:11px;height:11px;fill:currentColor}
.recorrido .avance{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--oro)}
.recorrido[aria-pressed="true"]{border-color:var(--oro);background:var(--sim-fondo)}

.pie{padding:14px 0 26px;border-top:1px solid var(--linea);font-size:12px;color:var(--tinta-3);display:grid;gap:4px}

/* ---------- pantallas medianas y celular: la imagen primero ---------- */
@media (max-width: 1180px){
  .tablero{grid-template-columns:minmax(0,1fr);grid-template-areas:"escena" "dims" "lectura"}
  .dimensiones{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .dim{flex:none;width:132px;min-height:84px;scroll-snap-align:start}
}
@media (max-width: 720px){
  body{font-size:14px;padding-inline:12px}
  .cabecera{gap:6px 10px;padding-block:8px}
  .cabecera h1{display:none}
  .antetitulo{font-size:10px}
  .vistas button{padding:4px 12px;min-height:30px;font-size:12px}
  .sello{font-size:10px;padding:2px 8px}
  .escena{padding:10px}
  .escenario{height:auto;aspect-ratio:6/5.4}
  .capa-cuadricula{gap:5px;padding:2px}
  .tesela{padding:6px;border-radius:7px}
  .tesela .nombre{font-size:10px;line-height:1.1;hyphens:manual;overflow-wrap:anywhere}
  .tesela .nombre .largo{display:none}
  .tesela .nombre .corto{display:inline}
  .tesela .cifra{font-size:14px}
  .tesela .cifra small{display:none}
  .signo span{display:none}
  .signo b{width:15px;height:15px;font-size:10px}
  .con-ficha .capa{right:0}
  .zoom button.texto{display:none}
  .ficha{position:fixed;left:8px;right:8px;bottom:8px;width:auto;padding:12px 14px;max-height:62vh;overflow:auto}
  .ficha h3{font-size:17px}
  .anio-grande{font-size:26px}
  .lectura{padding:16px}
  .frase{font-size:20px}
}
.quieto *,.quieto *::before,.quieto *::after{animation:none!important;transition:none!important}  /* capturas */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>// Tablero del Análisis Territorial, prototipo (tercera versión: el mapa del DANE manda). La página no calcula cifras ni redacta frases:
// todo llega listo en el bloque #datos, que escribe tablero/construir.py. Las piezas se construyen una vez y
// después solo cambian sus clases, para que el color, la ficha y la frase se muevan con transiciones.
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("datos").textContent);
  const INDS = D.dimensiones.flatMap((d) => d.indicadores.map((i) => Object.assign({ dim: d }, i)));
  const POR_CLAVE = Object.fromEntries(INDS.map((i) => [i.clave, i]));
  const UNIDAD = Object.fromEntries(D.unidades.map((u) => [u.cod, u]));
  const estado = { i: "homicidios_sisc", a: null, u: null, vista: "mapa", cifras: false, resaltar: [] };
  const PASO_MS = 800;  // un año de la línea de tiempo
  let reloj = null, recorrido = null;

  const $ = (id) => document.getElementById(id);

  const SVG = "http://www.w3.org/2000/svg";
  const ICONOS = {

    escudo: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
    corazon: "M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z",
    libro: "M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5zM12 6v13.5",
    hoja: "M5 19C5 10 10.5 5 19 5c0 8.5-5 14-14 14zM5 19l7-7",
    via: "M9 3L6 21M15 3l3 18M12 5v2.5M12 10.5v3M12 16.5v2.5",
    nube: "M7 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 10 4.3 4.3 0 0 0 7 18.5z",
  };
  const PLAY = '<svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg>';
  const PAUSA = '<svg viewBox="0 0 12 12"><path d="M2.5 1.5h2.6v9H2.5zM6.9 1.5h2.6v9H6.9z"/></svg>';

  const ind = () => POR_CLAVE[estado.i];
  const paso = () => ind().anios.find((p) => p.anio === estado.a) || ind().anios[ind().anios.length - 1];
  // Semáforo (Carlos, 29-oct): además del color, cada estado lleva un signo y una palabra, para quien no
  // distingue el rojo del verde.
  const SEMAFORO = { mejor: ["✓", "Mejor"], parecido: ["≈", "Parecido"], peor: ["!", "Peor"] };
  const tonoClase = (t) => (t === "rayada" ? "rayada" : t === null || t === undefined ? "sin" : SEMAFORO[t] ? "s-" + t : "n" + t);

  // --- piezas que se construyen una sola vez ---------------------------------------------------
  function construir() {
    $("dimensiones").innerHTML = D.dimensiones.map((d) => `<button class="dim" data-dim="${d.clave}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONOS[d.icono]}"/></svg>${esc(d.nombre)}</button>`).join("");

    const cuad = $("cuadricula");
    cuad.innerHTML = `<svg class="rio" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path d="M6 0 C 10 18, 2 30, 6 50 S 2 82, 6 100"/></svg>
      <span class="rio-nombre">Río Medellín</span>` + D.unidades.map((u) => `<button class="tesela${u.tipo === "corregimiento" ? " corr" : ""}"
        data-u="${u.cod}" style="grid-column:${u.col + 1};grid-row:${u.fila + 1};--retraso:${(u.col + u.fila) * 45}ms">
        <span class="nombre"><span class="largo">${esc(u.nombre)}</span><span class="corto">${esc(u.corto)}</span></span>
        <span class="pie-tesela"><span class="signo"></span><span class="cifra"></span></span></button>`).join("");

    const rayado = `<defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--sin-dato)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--sin-dato-raya)" stroke-width="3"/></pattern></defs>`;
    const trazos = D.mapa.comunas.map((c) => {
      const u = UNIDAD[c.cod];
      return `<path d="${c.d}" data-u="${c.cod}" style="--retraso:${(u.col + u.fila) * 45}ms"><title>${esc(u.nombre)}</title></path>`;
    }).join("");
    $("mapa").innerHTML = rayado + `<g class="comunas">${trazos}</g><g class="rotulos"></g><g class="puntos"></g>`;
    aplicarCaja();

    $("recorridos").innerHTML = D.recorridos.map((r, n) => `<button class="recorrido" data-recorrido="${n}" aria-pressed="false">
      <span class="play">${PLAY}</span>${esc(r.titulo)}<span class="avance"></span></button>`).join("");
    $("pie").innerHTML = `<p>${esc(D.aviso)} Contrato ${esc(D.contrato)}. Las frases siguen las reglas de la spec del modelo (docs/06), que todavía no está aprobada.</p>
      <p>Límites: DANE, Marco Geoestadístico Nacional 2018. Los años por comuna de la línea de tiempo salen de los mismos archivos del piloto.</p>`;
  }

  // --- la imagen: cuadrícula, mapa o estaciones -------------------------------------------------
  let indPintado = null;
  function pintarImagen() {
    const I = ind(), p = paso(), estaciones = I.modo === "estaciones";
    const enMapa = estaciones || estado.vista === "mapa";  // las estaciones necesitan el mapa (R11, I7)
    $("cuadricula").classList.toggle("activa", !enMapa);
    $("mapa").classList.toggle("activa", enMapa);
    $("zoom").hidden = !enMapa;
    $("escenario").classList.toggle("enfoque", !!estado.u || estado.resaltar.length > 0);
    $("escenario").classList.toggle("con-cifras", estado.cifras);

    const marcar = (el, base) => {
      const cod = el.dataset.u;
      el.setAttribute("class", base(cod));
      el.classList.toggle("elegida", estado.u === cod);
      el.classList.toggle("resaltada", estado.resaltar.includes(cod));
    };
    document.querySelectorAll(".tesela").forEach((el) => marcar(el, (cod) =>
      `tesela${UNIDAD[cod].tipo === "corregimiento" ? " corr" : ""} ${tonoClase(p.tonos[cod])}`));
    // R11: con un indicador de estaciones las comunas van en gris claro y no se pintan.
    document.querySelectorAll("#mapa path").forEach((el) => marcar(el, (cod) => (estaciones ? "gris" : tonoClase(p.tonos[cod]))));
    document.querySelectorAll(".tesela").forEach((el) => {
      const cod = el.dataset.u, cifra = p.cifras[cod], s = SEMAFORO[p.tonos[cod]];
      el.querySelector(".cifra").innerHTML = cifra === undefined ? "" : esc(cifra) + (p.partes ? `<small>${esc(p.partes[cod])}</small>` : "");
      el.querySelector(".signo").innerHTML = s ? `<b>${s[0]}</b><span>${s[1]}</span>` : "";
    });
    const rotulos = $("mapa").querySelector(".rotulos");
    rotulos.innerHTML = "";
    // Rótulo de cada unidad: su nombre y, debajo, el signo del semáforo y la cifra (la cifra, con «Ver cifras»).
    $("mapa").querySelectorAll(".comunas path").forEach((el) => {
      const cod = el.dataset.u, cifra = p.cifras[cod], s = SEMAFORO[p.tonos[cod]];
      const b = centro(el);
      const t = document.createElementNS(SVG, "text");
      t.setAttribute("x", b.x); t.setAttribute("y", b.y); t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", UNIDAD[cod].tipo === "corregimiento" ? "corr" : "");
      let linea = (s ? `<tspan class="signo-mapa">${s[0]}</tspan> ` : "") + (cifra === undefined ? "" : `<tspan class="cifra-mapa">${esc(cifra)}</tspan>`);
      t.innerHTML = `<tspan class="nom" x="${b.x}">${esc(UNIDAD[cod].nombre)}</tspan>` + (estaciones || !linea ? "" : `<tspan class="val" x="${b.x}" dy="1.2em">${linea}</tspan>`);
      rotulos.appendChild(t);
    });
    const puntos = $("mapa").querySelector(".puntos");
    if (!estaciones) puntos.innerHTML = "";
    else if (indPintado !== I.clave) {
      puntos.innerHTML = I.estaciones.map((e, k) => `<g class="punto" style="--retraso:${k * 60}ms" transform="translate(${e.x} ${e.y})">
        <circle class="${e.fuera ? "fuera" : e.estado ? "s-" + e.estado : ""}" r="1" style="${e.fuera || e.estado ? "" : `fill:var(--t${e.nivel})`}">
          <title>${esc(e.nombre)}: ${e.fuera ? "fuera del rango" : esc(e.texto)}</title></circle>
        ${e.estado ? `<text class="signo-punto" y="0.38" text-anchor="middle">${SEMAFORO[e.estado][0]}</text>` : ""}
        <text class="cifra-punto" x="1.4" y="0.4">${e.fuera ? "" : esc(e.texto)}</text></g>`).join("");
      puntos.classList.remove("crece"); void puntos.getBBox(); puntos.classList.add("crece");  // los puntos crecen de nuevo
    }
    escalar();
    indPintado = I.clave;
  }

  // --- el mapa se acerca y se aleja: se anima el viewBox del SVG ------------------------------------
  let caja = D.mapa.urbano.slice(), animacion = null, enfocada = undefined;
  function aplicarCaja() {
    $("mapa").setAttribute("viewBox", caja.map((n) => n.toFixed(1)).join(" "));
    escalar();
  }
  function escalar() {  // el texto y los puntos guardan su tamaño en la pantalla aunque el mapa se acerque
    const mapa = $("mapa"), k = caja[2] / Math.max(mapa.clientWidth || 800, 1);
    const g = mapa.querySelector(".rotulos");
    if (!g) return;
    g.style.fontSize = `${13 * k}px`;
    g.style.strokeWidth = `${4 * k}px`;
    mapa.classList.toggle("lejos", k > 1.8);  // de lejos no caben los nombres de las comunas urbanas
    mapa.querySelectorAll(".punto").forEach((p) => {
      const t = p.getAttribute("transform").replace(/ scale\([^)]*\)/, "");
      p.setAttribute("transform", `${t} scale(${11 * k})`);
    });
    const patron = mapa.querySelector("#rayado");
    if (patron) patron.setAttribute("patternTransform", `rotate(45) scale(${Math.max(k, 0.2)})`);
  }
  function irA(destino, ms = 700) {
    cancelAnimationFrame(animacion);
    const desde = caja.slice(), t0 = performance.now();
    if (document.documentElement.classList.contains("quieto")) ms = 1;
    const cuadro = (t) => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      caja = desde.map((v, i) => v + (destino[i] - v) * e);
      aplicarCaja();
      if (k < 1) animacion = requestAnimationFrame(cuadro);
    };
    animacion = requestAnimationFrame(cuadro);
  }
  function proporcion() {  // ancho / alto del mapa cuando termine de moverse (la ficha le quita 384 px en escritorio)
    const r = $("escenario").getBoundingClientRect();
    const ancho = estado.u && window.innerWidth > 720 ? r.width - 384 : r.width;
    return Math.max(ancho, 1) / Math.max(r.height, 1);
  }
  function cajaDe(cod) {
    const b = $("mapa").querySelector(`.comunas path[data-u="${cod}"]`).getBBox(), minimo = D.mapa.urbano[2] * 0.32;
    const w = Math.max(b.width * 1.9, minimo), h = Math.max(b.height * 1.9, minimo * 0.7);
    return centrada(b.x + b.width / 2, b.y + b.height / 2, w, h);
  }
  function centrada(cx, cy, w, h) {
    const p = proporcion();
    if (w / h < p) w = h * p; else h = w / p;
    return [cx - w / 2, cy - h / 2, w, h];
  }
  function urbana() {  // los centros de las 16 comunas, con margen: las comunas grandes del borde se cortan un poco
    const centros = [...$("mapa").querySelectorAll(".comunas path")].filter((el) => el.dataset.u < "50").map(centro);
    const xs = centros.map((c) => c.x), ys = centros.map((c) => c.y), m = 70;
    const x0 = Math.min(...xs) - m, x1 = Math.max(...xs) + m, y0 = Math.min(...ys) - m, y1 = Math.max(...ys) + m;
    return centrada((x0 + x1) / 2, (y0 + y1) / 2, x1 - x0, y1 - y0);
  }
  const ciudad = () => centrada(D.mapa.ciudad[2] / 2, D.mapa.ciudad[3] / 2, D.mapa.ciudad[2], D.mapa.ciudad[3]);
  function acercar(factor, cx = caja[0] + caja[2] / 2, cy = caja[1] + caja[3] / 2, ms = 350) {
    const w = Math.min(Math.max(caja[2] * factor, 120), D.mapa.ciudad[2] * 1.4), h = w * (caja[3] / caja[2]);
    const destino = [cx - (cx - caja[0]) * (w / caja[2]), cy - (cy - caja[1]) * (h / caja[3]), w, h];
    if (ms) irA(destino, ms); else { cancelAnimationFrame(animacion); caja = destino; aplicarCaja(); }
  }
  function centro(el) {  // dónde va el rótulo: el centro de la caja, salvo en las formas muy irregulares
    const b = el.getBBox();
    return { x: b.x + b.width / 2, y: b.y + b.height / 2 };
  }
  function deEstaciones(I) {  // todas las estaciones del indicador a la vista, con margen
    const xs = I.estaciones.map((e) => e.x), ys = I.estaciones.map((e) => e.y), m = 70;
    const x0 = Math.min(...xs) - m, x1 = Math.max(...xs) + m, y0 = Math.min(...ys) - m, y1 = Math.max(...ys) + m;
    return centrada((x0 + x1) / 2, (y0 + y1) / 2, Math.max(x1 - x0, 450), Math.max(y1 - y0, 350));
  }
  let enfocadoInd = null;
  function seguirComuna() {  // al tocar una comuna, el mapa se acerca a ella; al cerrar, vuelve a la zona urbana
    const I = ind(), cambioEstaciones = I.modo === "estaciones" && enfocadoInd !== I.clave;
    enfocadoInd = I.clave;
    if (estado.u === enfocada && !cambioEstaciones) return;
    enfocada = estado.u;
    if (!$("mapa").classList.contains("activa")) return;
    irA(estado.u ? cajaDe(estado.u) : I.modo === "estaciones" ? deEstaciones(I) : urbana());
  }

  function pintarLeyenda() {
    const I = ind(), p = paso(), e = I.escala;
    if (!e) { $("leyenda").innerHTML = `<span class="muestra"><i class="gris"></i>Sin dato por comuna</span>`; return; }
    const tonos = Object.values(p.tonos);
    let s = e.tipo === "semaforo"
      ? Object.entries(e.items).map(([k, t]) => `<span class="muestra"><i class="s-${k}">${SEMAFORO[k][0]}</i>${esc(t)}</span>`).join("")
        + `<span>${esc(e.nota)}</span>`
      : `<span class="rampa">${esc(e.bajo)}${[0, 1, 2, 3, 4, 5].map((n) => `<i style="background:var(--t${n})"></i>`).join("")}${esc(e.alto)}</span>
      <span><b>${esc(e.texto)}.</b>${e.nota ? " " + esc(e.nota) + "." : ""} ${esc(e.sin_semaforo || "")}</span>`;
    if (tonos.includes("rayada")) s += `<span class="muestra"><i class="raya"></i>muestra pequeña</span>`;  // I3: solo lo que aparece
    if (I.modo !== "estaciones" && D.unidades.some((u) => p.tonos[u.cod] === undefined || p.tonos[u.cod] === null)) s += `<span class="muestra"><i class="gris"></i>sin dato</span>`;
    if (I.modo === "estaciones" && I.estaciones.some((x) => x.fuera)) s += `<span class="muestra"><i class="punto"></i>fuera del rango</span>`;
    $("leyenda").innerHTML = s;
  }

  // --- controles -------------------------------------------------------------------------------
  function pintarControles() {
    const I = ind();
    document.querySelectorAll(".dim").forEach((b) => b.setAttribute("aria-pressed", b.dataset.dim === I.dim.clave));
    $("subindicadores").innerHTML = I.dim.indicadores.length > 1
      ? I.dim.indicadores.map((x) => `<button class="sub" data-i="${x.clave}" aria-pressed="${x.clave === I.clave}">${esc(x.corto)}</button>`).join("")
      : `<span class="sub-titulo">${esc(I.corto)}</span>`;
    document.querySelectorAll("[data-vista]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vista === estado.vista));
    $("cifras").setAttribute("aria-pressed", estado.cifras);
    $("cifras").textContent = estado.cifras ? "Ocultar cifras" : "Ver cifras";
    pintarTiempo();
  }

  let tiempoDe = null;
  function pintarTiempo() {
    const I = ind(), n = I.anios.length, k = I.anios.indexOf(paso());
    if (n < 2) { $("tiempo").innerHTML = ""; tiempoDe = null; return; }
    if (tiempoDe !== I.clave) {
      $("tiempo").innerHTML = `<button class="reproducir" id="reproducir" aria-label="Reproducir los años">${PLAY}</button>
        <div class="regla-tiempo"><input type="range" id="regla" min="0" max="${n - 1}" step="1" aria-label="Año">
          <div class="marcas"><span>${I.anios[0].anio}</span><span>${I.anios[n - 1].anio}</span></div></div>
        <div class="anio-grande" id="anio-grande"></div>`;
      tiempoDe = I.clave;
    }
    $("regla").value = k;
    $("anio-grande").textContent = I.anios[k].anio;
    $("reproducir").innerHTML = reloj ? PAUSA : PLAY;
  }

  // --- lectura y ficha -------------------------------------------------------------------------
  function pintarLectura() {
    const I = ind(), p = paso(), l = estado.u ? p.unidades[estado.u] : p.lectura;
    $("lectura-de").textContent = [I.dim.nombre, I.corto, estado.u && UNIDAD[estado.u].nombre].filter(Boolean).join(" · ");
    const frase = `${esc(l.si)}<span class="fuente">${esc(I.fuente_corta)} · ${esc(p.etiqueta)}</span>`;
    const el = $("frase");
    if (el.innerHTML !== frase) { el.innerHTML = frase; el.classList.remove("cambia"); void el.offsetWidth; el.classList.add("cambia"); }
    $("no").innerHTML = l.no.slice(0, 2).map((n) => `<p>${esc(n.texto)}<span class="regla" title="${esc(n.regla)}: ${esc(D.reglas[n.regla])}">${esc(n.regla)}</span></p>`).join("");
    $("ciudad").innerHTML = p.ciudad ? `<b>${esc(p.ciudad)}</b> ${esc(I.unidad)} en toda Medellín, ${p.anio}` : "";
    $("ciudad").hidden = !p.ciudad;
    $("detalle-cuerpo").innerHTML = `<p>${esc(I.definicion)}</p>
      <h3>Lo que dice el contrato</h3><ul>${I.frases_contrato.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      <h3>Lo que este dato no permite decir</h3><ul>${I.no_se_puede_decir.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      <p>Fuente: ${esc(I.fuente.productor)} · ${esc(I.fuente.licencia.split(" (")[0])} · <a href="${esc(I.fuente.url)}" rel="noopener">archivo</a></p>`;
  }

  function curva(I, cod) {
    const puntos = I.anios.filter((p) => p.valores && p.valores[cod] !== undefined && p.valores[cod] !== null);
    if (puntos.length < 2) return "";
    const W = 320, H = 86, vs = puntos.map((p) => p.valores[cod]), min = Math.min(...vs), max = Math.max(...vs);
    const x = (k) => 10 + (k / (puntos.length - 1)) * (W - 20), y = (v) => 58 - ((v - min) / ((max - min) || 1)) * 46;
    const linea = puntos.map((p, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(p.valores[cod]).toFixed(1)}`).join(" ");
    const a = puntos[0], b = puntos[puntos.length - 1], k = puntos.findIndex((p) => p.anio === paso().anio);
    // R10: solo se rotulan el primer y el último año.
    return `<svg class="curva" viewBox="0 0 ${W} ${H}" role="img" aria-label="Años de ${esc(UNIDAD[cod].nombre)}">
      <path class="area" d="${linea} L${x(puntos.length - 1)},62 L${x(0)},62 Z"/><path d="${linea}"/>
      ${k >= 0 ? `<circle class="ahora" cx="${x(k)}" cy="${y(puntos[k].valores[cod])}" r="5"/>` : ""}
      <text x="${x(0)}" y="80">${a.anio}: ${esc(a.cifras[cod])}</text><text x="${x(puntos.length - 1)}" y="80" text-anchor="end">${b.anio}: ${esc(b.cifras[cod])}</text></svg>`;
  }

  let fichaDe = null;
  function pintarFicha() {
    const f = $("ficha");
    $("escenario").classList.toggle("con-ficha", !!estado.u);
    if (!estado.u) { f.hidden = true; fichaDe = null; return; }
    const I = ind(), u = UNIDAD[estado.u], l = paso().unidades[estado.u];
    const cifras = INDS.map((x) => {
      const ultimo = x.anios[x.anios.length - 1], c = ultimo.cifras[u.cod];
      const valor = x.modo === "estaciones" ? "en estaciones" : c === undefined ? "sin dato" : `${c} · ${ultimo.anio}`;
      return `<li><span>${esc(x.corto)}</span><b>${esc(valor)}</b></li>`;
    }).join("");
    f.innerHTML = `<div class="ficha-cabeza"><div><p class="tipo">${u.tipo === "corregimiento" ? "Corregimiento" : "Comuna"} · ${esc(I.corto)}</p>
        <h3>${esc(u.nombre)}</h3></div><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
      ${SEMAFORO[paso().tonos[u.cod]] ? `<p class="ficha-estado s-${paso().tonos[u.cod]}"><b>${SEMAFORO[paso().tonos[u.cod]][0]}</b>${
        esc(I.escala.items[paso().tonos[u.cod]])}</p>` : ""}
      <p class="ficha-frase">${esc(l.si)}</p>${curva(I, u.cod)}
      <details><summary>Ver sus once cifras</summary><ul>${cifras}</ul></details>`;
    if (fichaDe !== u.cod) { f.hidden = false; f.style.animation = "none"; void f.offsetWidth; f.style.animation = ""; }
    f.hidden = false;
    fichaDe = u.cod;
  }

  // --- estado ----------------------------------------------------------------------------------
  function pintar(opciones = {}) {
    $("escenario").classList.toggle("rapido", !!opciones.rapido);
    pintarControles();
    pintarImagen();
    pintarLeyenda();
    pintarLectura();
    pintarFicha();
    seguirComuna();
    const p = new URLSearchParams({ i: estado.i, a: paso().anio });
    if (estado.u) p.set("u", estado.u);
    if (estado.vista === "cuadricula") p.set("v", "cuadricula");
    if (estado.cifras) p.set("c", "1");
    const antes = new URLSearchParams(location.hash.slice(1));
    for (const k of ["t", "q"]) if (antes.get(k)) p.set(k, antes.get(k));
    history.replaceState(null, "", "#" + p.toString());
  }

  function ir(cambios, opciones) {
    if (cambios.i && cambios.i !== estado.i && !("a" in cambios)) cambios.a = null;  // otro indicador: su último año
    Object.assign(estado, cambios);
    pintar(opciones);
  }

  function leerDireccion() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (POR_CLAVE[p.get("i")]) estado.i = p.get("i");  // lo que no existe se ignora
    estado.a = ind().anios.some((x) => x.anio === +p.get("a")) ? +p.get("a") : null;
    estado.u = UNIDAD[p.get("u")] ? p.get("u") : null;
    estado.vista = p.get("v") === "cuadricula" ? "cuadricula" : "mapa";
    estado.cifras = p.get("c") === "1";
    const tema = { claro: "light", oscuro: "dark" }[p.get("t")];
    if (tema) document.documentElement.dataset.theme = tema;
    document.documentElement.classList.toggle("quieto", p.get("q") === "1");  // capturas sin animación
    return p.get("r");
  }

  // --- tiempo y recorridos ---------------------------------------------------------------------
  function parar() {
    clearInterval(reloj); reloj = null;
    $("escenario").classList.remove("rapido");
    if ($("reproducir")) $("reproducir").innerHTML = PLAY;
  }
  function reproducir(alTerminar) {
    const I = ind();
    let k = I.anios.indexOf(paso());
    if (k === I.anios.length - 1) k = 0;
    ir({ a: I.anios[k].anio }, { rapido: true });
    reloj = setInterval(() => {
      k += 1;
      if (k >= I.anios.length) { parar(); if (alTerminar) alTerminar(); return; }
      ir({ a: I.anios[k].anio }, { rapido: true });
    }, PASO_MS);
    $("reproducir").innerHTML = PAUSA;
  }

  function pararRecorrido() {
    if (!recorrido) return;
    clearTimeout(recorrido.espera);
    parar();
    document.querySelectorAll(".recorrido").forEach((b) => { b.setAttribute("aria-pressed", "false"); b.querySelector(".avance").style.cssText = ""; });
    recorrido = null;
    ir({ resaltar: [] });
  }
  function correr(n) {
    pararRecorrido();
    const R = D.recorridos[n], boton = document.querySelector(`[data-recorrido="${n}"]`), avance = boton.querySelector(".avance");
    recorrido = { n, k: 0, espera: null };
    boton.setAttribute("aria-pressed", "true");
    const siguiente = () => {
      if (!recorrido || recorrido.n !== n) return;
      if (recorrido.k >= R.pasos.length) {
        avance.style.cssText = "width:100%";
        recorrido.espera = setTimeout(() => { recorrido = null; boton.setAttribute("aria-pressed", "false"); avance.style.cssText = ""; }, 900);
        return;
      }
      const s = R.pasos[recorrido.k++];
      avance.style.cssText = `width:${(100 * recorrido.k) / R.pasos.length}%;transition:width ${s.ms}ms linear`;
      ir({ i: s.i, a: s.a || null, u: s.u || null, resaltar: s.resaltar || [] });
      if (s.reproducir) reproducir(() => { recorrido.espera = setTimeout(siguiente, s.ms); });
      else recorrido.espera = setTimeout(siguiente, s.ms);
    };
    siguiente();
  }

  // --- eventos ---------------------------------------------------------------------------------
  document.addEventListener("click", (ev) => {
    if (arrastrado) { arrastrado = false; return; }  // soltar después de arrastrar el mapa no es un clic
    const el = ev.target.closest("[data-dim],[data-i],[data-u],[data-vista],[data-recorrido],[data-cerrar],[data-zoom],#cifras,#reproducir,.marca");
    if (!el) return;
    if (el.dataset.zoom) {
      const z = el.dataset.zoom;
      return z === "mas" ? acercar(0.7) : z === "menos" ? acercar(1 / 0.7) : irA(z === "ciudad" ? ciudad() : urbana());
    }
    if (el.dataset.recorrido !== undefined) {
      const n = +el.dataset.recorrido;
      return recorrido && recorrido.n === n ? pararRecorrido() : correr(n);
    }
    pararRecorrido();  // tocar cualquier otra cosa detiene el recorrido
    if (el.id === "reproducir") return reloj ? parar() : reproducir();
    parar();
    if (el.classList.contains("marca")) { ev.preventDefault(); return ir({ u: null, resaltar: [] }); }
    if (el.dataset.dim) {
      const d = D.dimensiones.find((x) => x.clave === el.dataset.dim);
      return ir({ i: ind().dim.clave === d.clave ? estado.i : d.indicadores[0].clave });
    }
    if (el.dataset.i) return ir({ i: el.dataset.i });
    if (el.dataset.vista) { ir({ vista: el.dataset.vista }); enfocada = undefined; return seguirComuna(); }
    if (el.id === "cifras") return ir({ cifras: !estado.cifras });
    if (el.hasAttribute("data-cerrar")) return ir({ u: null });
    if (el.dataset.u) return ir({ u: estado.u === el.dataset.u ? null : el.dataset.u, resaltar: [] });
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id !== "regla") return;
    pararRecorrido(); parar();
    ir({ a: ind().anios[+ev.target.value].anio }, { rapido: true });
  });
  // Rueda para acercar donde está el puntero, y arrastrar para mover el mapa.
  const aMapa = (ev) => {
    const m = $("mapa").getScreenCTM().inverse(), pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
    return [pt.x, pt.y];
  };
  $("mapa").addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const [x, y] = aMapa(ev);
    acercar(Math.exp(ev.deltaY * 0.0015), x, y, 0);
  }, { passive: false });
  let agarre = null, arrastrado = false;
  $("mapa").addEventListener("pointerdown", (ev) => { agarre = { x: ev.clientX, y: ev.clientY, caja: caja.slice() }; });
  window.addEventListener("pointermove", (ev) => {
    if (!agarre) return;
    const dx = ev.clientX - agarre.x, dy = ev.clientY - agarre.y;
    if (!arrastrado && Math.hypot(dx, dy) < 5) return;
    arrastrado = true;
    const k = caja[2] / $("mapa").clientWidth;
    cancelAnimationFrame(animacion);
    caja = [agarre.caja[0] - dx * k, agarre.caja[1] - dy * k, caja[2], caja[3]];
    aplicarCaja();
  });
  window.addEventListener("pointerup", () => { agarre = null; setTimeout(() => { arrastrado = false; }, 0); });
  window.addEventListener("resize", () => { if (!estado.u) { caja = urbana(); aplicarCaja(); } });

  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && estado.u) ir({ u: null }); });
  window.addEventListener("hashchange", () => { if (!recorrido && !reloj) { leerDireccion(); pintar(); } });

  construir();
  const autoRecorrido = leerDireccion();
  pintar();
  cancelAnimationFrame(animacion);  // abre en la zona urbana: las comunas no quedan chicas
  caja = estado.u ? cajaDe(estado.u) : ind().modo === "estaciones" ? deEstaciones(ind()) : urbana();
  aplicarCaja();
  if (autoRecorrido !== null && D.recorridos[+autoRecorrido]) setTimeout(() => correr(+autoRecorrido), 700);
})();
</script>
</body>
</html>
